<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gold Star Shootout: a retro soccer penalty shootout starring the Chaminade Flyers.">
<meta name="theme-color" content="#8f1229">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238b1a2b'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23fff8e8' stroke='%231a1a1a' stroke-width='3'/%3E%3Cpath d='M32 22l8 6-3 9h-10l-3-9z' fill='%231a1a1a'/%3E%3C/svg%3E">
<title>Gold Star Shootout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* One portrait canvas pitch centered on the page; menus are full-screen overlays. Same red-and-gold look as the rest of Chaminade Games. */
:root{
  --night:#8f1229; --night-2:#ad1c37; --line:#e0aa2e; --deep:#6a0b1e; --crimson:#4a0612;
  --gold:#ffc72c; --chalk:#fff8e8; --dim:#ffe2a8; --turf:#3c8a3a;
  --f-display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#2a0510;color:var(--chalk);font-family:var(--f-body);font-size:18px;line-height:1.4;margin:0;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-variant-ligatures:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;image-rendering:pixelated}
#quit{position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:8px;z-index:4;font-family:var(--f-display);font-size:9px;padding:9px 10px;background:var(--deep);border:2px solid var(--line);color:var(--chalk);cursor:pointer}
.overlay{position:fixed;inset:0;overflow-y:auto;z-index:5;background:linear-gradient(180deg,#a5172f 0,#8f1229 320px,#7d0f23 100%);padding-block:max(12px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));padding-inline:16px}
.overlay[hidden]{display:none}
.panel{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:clamp(16px,4vw,22px);color:var(--gold);line-height:1.35}
h3{font-size:11px;color:var(--gold);line-height:1.5}
p{margin:0;max-width:62ch}
.eyebrow{font-family:var(--f-display);font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.marquee{border:4px solid var(--gold);background:repeating-linear-gradient(135deg,rgba(255,199,44,.07) 0 14px,transparent 14px 28px),linear-gradient(#c22540,#8f1229);padding:20px 18px 18px}
.marquee h1{font-size:clamp(22px,6vw,42px);line-height:1.15;color:var(--gold);text-shadow:4px 4px 0 var(--crimson);margin-top:10px}
.marquee p{margin-top:12px}
.box{background:var(--night-2);border:2px solid var(--line);padding:14px;box-shadow:0 6px 0 var(--crimson);display:flex;flex-direction:column;gap:10px}
.muted{color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-family:var(--f-display);font-size:11px;line-height:1.2;padding:13px 14px;background:var(--gold);color:#5a0d1c;border:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px var(--night-2),0 0 0 5px #fff3c4;text-transform:uppercase;margin:5px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#ffd65c}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:var(--deep);color:var(--chalk);box-shadow:0 0 0 2px var(--line)}
.btn.ghost:hover{background:#86122b}
.btn:focus-visible,.pick:focus-visible{outline:3px dashed var(--gold);outline-offset:5px}
.btn[disabled]{opacity:.45;cursor:default}
.gs-home{display:inline-block;align-self:flex-start;font-family:var(--f-display);font-size:10px;line-height:1;padding:10px 12px;background:var(--deep);border:2px solid var(--line);color:var(--chalk);text-decoration:none}
.gs-home:hover{background:#86122b}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-family:var(--f-display);font-size:9px;padding:10px 10px;background:var(--deep);color:var(--chalk);border:2px solid var(--line);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:#5a0d1c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;font-size:16px;color:var(--chalk);background:var(--deep);border:2px solid rgba(224,170,46,.45);padding:8px 10px 8px 40px;cursor:pointer;min-height:56px}
.pick .num{position:absolute;left:8px;top:8px;font-family:var(--f-display);font-size:10px;color:var(--gold)}
.pick .meta{font-size:14px;color:var(--dim)}
.pick.on{border-color:var(--gold);background:#7a1426}
.pick .ord{position:absolute;right:6px;top:6px;font-family:var(--f-display);font-size:10px;background:var(--gold);color:#5a0d1c;padding:4px 5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--deep);border:2px solid rgba(224,170,46,.45);padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:16px;color:var(--gold);font-weight:400;margin-bottom:4px}
.kicklog{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.kicklog .g{color:#9fe58a}.kicklog .x{color:#ff9a9a}
.big{font-family:var(--f-display);font-size:clamp(26px,8vw,46px);color:var(--gold);text-shadow:4px 4px 0 var(--crimson)}
.foot{font-size:14px;color:var(--dim)}
.foot a{color:var(--gold)}
ol,ul{margin:0;padding-left:22px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" aria-label="Penalty shootout pitch"></canvas></div>
<button id="quit" hidden>MENU</button>
<div class="overlay" id="ov"></div>
<script>
'use strict';
// ---------- data ----------
// 2026 varsity roster, from athletics.chaminade-hs.org. Shooting and keeping ratings are invented for the game.
const POSN={GK:'Goalkeeper',D:'Defender',M:'Midfielder',F:'Forward'};
const R=(n,first,last,pos,yr,shot,keep)=>({id:'p'+n,n,first,last,pos,yr,shot,keep:keep||40,name:first+' '+last});
const ROSTER=[
 R('0','Conner','Gawlik','GK','Jr',52,80),
 R('00','Hunter','Chilelli','GK','Jr',50,78),
 R('1','Matthew','Lagasse','GK','Sr',55,86),
 R('2','Matthew','Kucharnik','D','Sr',70),
 R('3','Anthony','Giannola','D','Sr',72),
 R('4','Nicholas','McConaghy','D','Sr',71),
 R('5','Michael','Price','M','Sr',82),
 R('6','Joseph','Pavano','M','Sr',79),
 R('7','Sam','Dwyer','F','Sr',89),
 R('8','Yanni','Gordon','M','Jr',78),
 R('9','Brody','Zdunczyk','F','Sr',88),
 R('10','Hudson','Keefer','M','Sr',86),
 R('11','Giovanni','Giannola','M','Sr',81),
 R('12','Gabriel','Lake','D','Sr',70),
 R('13',"Nickolas","D'Andrea",'D','Sr',69),
 R('14','Jack','Hughes','D','Sr',71),
 R('15','Colin','Masse','M','Jr',76),
 R('16','Cleighton','Chambers','M','Sr',80),
 R('17','Kaden','Gallagher','M','Jr',77),
 R('18','Marco','Vasili','M','Sr',80),
 R('19','Sean','Gallagher','D','Jr',68),
 R('20','Tyler','Arma','M','Jr',76),
 R('21','Aidan','McGuigan','M','Sr',79),
 R('22','Jack','Allen','M','Jr',75),
 R('23','Bryce','Hsu','D','Jr',68),
 R('24','Owen','Zarboutis','M','Jr',75),
 R('25','Alexander','Nunez','F','Jr',85),
 R('37','Drew','Mastronardi','D','Jr',67),
];
const byId=id=>ROSTER.find(p=>p.id===id);
const SHOOTERS=ROSTER.filter(p=>p.pos!=='GK');
const KEEPERS=ROSTER.filter(p=>p.pos==='GK');
const DEFAULT_ORDER=['p7','p9','p10','p25','p5'];

// Rival CHSAA schools. Their shooters are shown by number only.
const TEAMS=[
 {id:'kell',name:'Kellenberg',nick:'Firebirds',short:'KELL',kit:'#1d2f8a',trim:'#ffffff',gk:'#2fbf4a',str:1.08},
 {id:'stan',name:"St. Anthony's",nick:'Friars',short:'SAHS',kit:'#a51c1c',trim:'#111111',gk:'#e8e23a',str:1.06},
 {id:'ht',name:'Holy Trinity',nick:'Titans',short:'HT',kit:'#14306b',trim:'#c9c9c9',gk:'#ff7a1a',str:1.0},
 {id:'iona',name:'Iona Prep',nick:'Gaels',short:'IONA',kit:'#7a0f1e',trim:'#f2c84b',gk:'#1aa3d9',str:1.0},
 {id:'xav',name:'Xaverian',nick:'Clippers',short:'XAV',kit:'#0f2a6e',trim:'#e8e8e8',gk:'#d93a8a',str:1.02},
 {id:'hc',name:'Holy Cross',nick:'Knights',short:'HC',kit:'#2e2a6e',trim:'#f0c040',gk:'#43c06a',str:0.96},
 {id:'molloy',name:'Archbishop Molloy',nick:'Stanners',short:'AMHS',kit:'#173a8a',trim:'#ffffff',gk:'#ffb52e',str:0.98},
 {id:'fp',name:'Fordham Prep',nick:'Rams',short:'FP',kit:'#6e1a2e',trim:'#e0e0e0',gk:'#3ac0b0',str:0.95},
];
const DIFFS=[
 {name:'JV',meter:1.7,scatter:.75,read:.06,cpuAcc:1.35,reachUs:1.3,reachCpu:.86,tellShow:.85,tellTrue:.9},
 {name:'Varsity',meter:1.3,scatter:1,read:.15,cpuAcc:1,reachUs:1.12,reachCpu:1,tellShow:.55,tellTrue:.72},
 {name:'All-State',meter:.95,scatter:1.25,read:.28,cpuAcc:.8,reachUs:1,reachCpu:1.12,tellShow:.35,tellTrue:.55},
];
const ROUNDS=['Quarterfinal','Semifinal','CHSAA Final'];

// ---------- storage ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let order=store.get('gss_order',DEFAULT_ORDER).filter(id=>byId(id)&&byId(id).pos!=='GK');
if(order.length!==5)order=[...DEFAULT_ORDER];
let keeperId=store.get('gss_keeper','p1'); if(!byId(keeperId))keeperId='p1';
let diffI=Math.max(0,Math.min(2,store.get('gss_diff',1)|0));
let muted=!!store.get('gss_muted',false);
const blankStats={played:0,won:0,titles:0,goals:0,shots:0,saves:0,faced:0,streak:0,best:0};
let stats=Object.assign({},blankStats,store.get('gss_stats',{}));
const saveStats=()=>store.set('gss_stats',stats);

// ---------- sound ----------
let actx=null;
function ac(){if(muted)return null;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){return null}return actx}
function tone(f,d,type='square',v=.06,slide=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d+.02)}
function noise(d,v=.08,hp=400){const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start()}
const sfx={
 whistle(){tone(2100,.12,'sine',.05);setTimeout(()=>tone(2300,.25,'sine',.05),130)},
 kick(){tone(140,.12,'triangle',.18,-80);noise(.05,.06,800)},
 goal(){noise(1.1,.07,300);[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.14,'square',.05),i*90))},
 save(){tone(220,.08,'square',.08);noise(.5,.05,600);setTimeout(()=>tone(330,.18,'square',.06),90)},
 miss(){tone(300,.3,'sawtooth',.05,-180);noise(.6,.03,900)},
 post(){tone(1600,.25,'triangle',.08,-400)},
 tick(){tone(880,.04,'square',.03)},
};

// ---------- canvas ----------
const W=360,H=560;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let scale=1;
function fit(){const dpr=Math.min(3,window.devicePixelRatio||1);scale=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*scale)+'px';cv.style.height=Math.floor(H*scale)+'px';cv.width=Math.floor(W*scale*dpr);cv.height=Math.floor(H*scale*dpr);ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.imageSmoothingEnabled=false}
addEventListener('resize',fit);fit();

// Goal geometry, in canvas pixels. gx runs -1 (left post) to 1 (right post); gy runs 0 (ground) to 1 (crossbar).
const GX=180,GL=244,GW=130,GH=128,SPOT={x:180,y:396};
const toPx=(gx,gy)=>({x:GX+gx*GW,y:GL-gy*GH});
const fromPx=(x,y)=>({gx:(x-GX)/GW,gy:(GL-y)/GH});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-t,3);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const rnd=(a,b)=>a+Math.random()*(b-a);
const colOf=gx=>gx<-.33?-1:gx>.33?1:0;

// Crowd, built once with a fixed seed so it doesn't flicker.
const CROWD=(()=>{let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;const out=[];for(let y=34;y<98;y+=6)for(let x=2;x<W;x+=6){const c=r();out.push({x:x+(r()*2|0),y,c:c<.38?'#ffc72c':c<.72?'#c22540':c<.85?'#fff8e8':'#4a0612',h:r()})}return out})();

// ---------- game state ----------
let G=null; // current shootout
let lastOpp=null;
let run=null; // playoff run: {opps:[], round}
let last=performance.now(),clock=0;

function newShootout(opp,label){
 lastOpp=opp;
 const diff=DIFFS[diffI];
 G={opp,label,diff,kicks:[],first:Math.random()<.5?'us':'them',phase:'intro',t:0,
   usIdx:0,themIdx:0,aim:null,pow:0,powT:0,shot:null,dive:null,keeper:null,msg:'',sub:'',tell:null,shooterNo:0,winner:null,ball:{...SPOT,r:8},cursor:null};
 G.turn=G.first;
 G.cpuShooters=Array.from({length:11},(_,i)=>({n:[9,10,7,11,8,14,6,17,3,4,5][i],shot:Math.round(clamp(rnd(70,88)*opp.str,60,95))}));
 G.cpuKeep=Math.round(clamp(rnd(74,86)*opp.str,65,95));
 document.getElementById('quit').hidden=false;
 hideOv();sfx.whistle();
}
function usOrder(){const rest=SHOOTERS.filter(p=>!order.includes(p.id)).sort((a,b)=>b.shot-a.shot).map(p=>p.id);return [...order,...rest]}
function counts(){let a=0,b=0,na=0,nb=0;for(const k of G.kicks){if(k.team==='us'){na++;if(k.res==='goal')a++}else{nb++;if(k.res==='goal')b++}}return{a,b,na,nb}}
function decided(){const {a,b,na,nb}=counts();
 if(na<=5&&nb<=5){if(a+(5-na)<b)return'them';if(b+(5-nb)<a)return'us';if(na===5&&nb===5&&a!==b)return a>b?'us':'them';return null}
 if(na===nb&&a!==b)return a>b?'us':'them';return null}

function nextKick(){
 G.aim=null;G.shot=null;G.dive=null;G.keeper=null;G.tell=null;G.pow=0;G.powT=0;G.ball={...SPOT,r:8};G.msg='';G.sub='';G.t=0;G.cursor=null;
 if(G.turn==='us'){const ids=usOrder();G.shooter=byId(ids[G.usIdx%ids.length]);G.usIdx++;G.phase='aim'}
 else{G.cpu=G.cpuShooters[G.themIdx%G.cpuShooters.length];G.themIdx++;
  // CPU picks a spot now; the tell may or may not point at it.
  const col=Math.random()<.2?0:(Math.random()<.5?-1:1),high=Math.random()<.45;
  G.cpuAim={gx:col===0?rnd(-.25,.25):col*rnd(.5,.9),gy:high?rnd(.58,.9):rnd(.1,.38)};
  if(Math.random()<G.diff.tellShow){const c=colOf(G.cpuAim.gx);G.tell={dir:c===0?(Math.random()<.5?-1:1):Math.random()<G.diff.tellTrue?c:-c}}
  G.phase='cpurun'}
}

// Ball physics for one kick. Called the moment the ball is struck.
function launch(){
 const d=G.diff;
 if(G.turn==='us'){
  const p=G.pow,sh=G.shooter.shot/100,sweet=p>=.62&&p<=.86;
  let sc=(.06+(1-sh)*.28)*d.scatter*(sweet?1:1.7);
  let gx=G.aim.gx+gauss()*sc,gy=G.aim.gy+gauss()*sc*.75;
  if(p>.86)gy+=(p-.86)*3.2;
  if(p<.4)gy-=(.4-p)*.6;
  gy=Math.max(gy,.03);
  const fl=.36+(1-p)*.62;
  // CPU keeper guesses before the kick, and sometimes reads the shooter.
  let col,high;
  if(Math.random()<d.read*G.opp.str){col=colOf(G.aim.gx);high=G.aim.gy>.5}
  else{const r=Math.random();col=r<.42?-1:r<.84?1:0;high=Math.random()<.45}
  // A weak shot lets the keeper adjust mid-dive.
  if(p<.42){col=colOf(gx);high=gy>.5}
  G.keeper={col,high,start:0};
  G.shot={gx,gy,fl,reach:d.reachCpu*(G.cpuKeep/80)};
 }else{
  const c=G.cpu;let sc=(.05+(1-c.shot/100)*.3)*d.cpuAcc;
  const gx=G.cpuAim.gx+gauss()*sc,gy=Math.max(.03,G.cpuAim.gy+gauss()*sc*.7+(Math.random()<.04?.3:0));
  const fl=rnd(.42,.58);
  if(G.dive)G.keeper={...G.dive,start:0};
  G.shot={gx,gy,fl,reach:d.reachUs*(byId(keeperId).keep/80)};
 }
 G.from={...SPOT};G.phase='flight';G.t=0;sfx.kick();
}

function diveTarget(k){if(!k)return{gx:0,gy:.32};if(k.col===0)return{gx:0,gy:k.high?.72:.3};return{gx:k.col*.6,gy:k.high?.7:.24}}
function resolve(){
 const s=G.shot;let res;
 const offPost=(Math.abs(s.gx)>.96&&Math.abs(s.gx)<1.06&&s.gy<1.04)||(s.gy>.96&&s.gy<1.06&&Math.abs(s.gx)<1.04);
 if(offPost)res='post';
 else if(Math.abs(s.gx)>1||s.gy>1)res=s.gy>1?'over':'wide';
 else{
  const k=G.keeper;const t=diveTarget(k);
  let reach=38*s.reach*Math.pow(s.fl/.52,.6);
  if(k&&k.late)reach*=.6;
  if(!k)reach=30;else if(k.col===0)reach*=.85;
  const dx=(s.gx-t.gx)*GW,dy=(s.gy-t.gy)*GH;const dist=Math.hypot(dx,dy*1.15);
  if(dist<reach)res='save';else if(dist<reach*1.22&&Math.random()<.4)res='save';else res='goal';
  // Top corners are close to unsaveable.
  if(res==='save'&&Math.abs(s.gx)>.86&&s.gy>.84&&Math.random()<.7)res='goal';
 }
 const scored=res==='goal';
 G.kicks.push({team:G.turn,res,who:G.turn==='us'?G.shooter:G.cpu});
 if(G.turn==='us'){stats.shots++;if(scored)stats.goals++}else{stats.faced++;if(!scored)stats.saves++}
 const usShoot=G.turn==='us';
 G.msg={goal:'GOAL!',save:'SAVED!',wide:'WIDE!',over:'OVER THE BAR!',post:'OFF THE POST!'}[res];
 G.good=usShoot?scored:!scored;
 G.res=res;G.phase='result';G.t=0;
 if(scored)sfx.goal();else if(res==='save')sfx.save();else if(res==='post')sfx.post();else sfx.miss();
 const end=toPx(s.gx,s.gy);
 G.bounce=res==='goal'?{vx:(s.gx)*20,vy:-30,x:end.x,y:end.y,net:true}:res==='save'?{vx:(s.gx>=0?1:-1)*rnd(120,190),vy:rnd(40,110),x:end.x,y:end.y}:res==='post'?{vx:-(Math.sign(s.gx)||1)*90,vy:120,x:end.x,y:end.y}:{vx:(s.gx)*60,vy:-60,x:end.x,y:end.y,away:true};
}

function afterResult(){
 G.turn=G.turn==='us'?'them':'us';
 const w=decided();
 if(w){G.winner=w;finish();return}
 nextKick();
}

function finish(){
 const won=G.winner==='us';stats.played++;
 if(won){stats.won++;stats.streak++;stats.best=Math.max(stats.best,stats.streak)}else stats.streak=0;
 let champ=false;
 if(run){if(won){run.round++;if(run.round>=ROUNDS.length){stats.titles++;champ=true}}}
 saveStats();
 G.phase='over';
 setTimeout(()=>showEnd(won,champ),900);
}

function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function inGoalArea(p){return p.x>GX-GW-26&&p.x<GX+GW+26&&p.y>GL-GH-28&&p.y<GL+20}
cv.addEventListener('pointerdown',e=>{if(!G)return;ac();const p=pt(e);
 if(G.phase==='aim'){if(inGoalArea(p)){const g=fromPx(p.x,p.y);G.aim={gx:clamp(g.gx,-1.15,1.15),gy:clamp(g.gy,0,1.18)};G.phase='power';G.powT=0;sfx.tick()}}
 else if(G.phase==='power'){if(inGoalArea(p)){const g=fromPx(p.x,p.y);G.aim={gx:clamp(g.gx,-1.15,1.15),gy:clamp(g.gy,0,1.18)};sfx.tick()}else strike()}
 else if(G.turn==='them'&&(G.phase==='cpurun'||(G.phase==='flight'&&G.t<.12))&&inGoalArea(p)){const g=fromPx(p.x,p.y);pickDive(colOf(g.gx),g.gy>.5)}
});

function strike(){G.phase='runup';G.t=0}
function pickDive(col,high){
 if(G.phase==='flight'){if(G.keeper)return;G.keeper={col,high,start:G.t,late:true};return}
 G.dive={col,high};sfx.tick();
}
addEventListener('keydown',e=>{if(!G||!document.getElementById('ov').hidden)return;const k=e.key;
 if(G.phase==='aim'||G.phase==='power'){
  if(!G.aim)G.aim={gx:0,gy:.5};
  const st=.08;
  if(k==='ArrowLeft')G.aim.gx=clamp(G.aim.gx-st,-1.15,1.15);else if(k==='ArrowRight')G.aim.gx=clamp(G.aim.gx+st,-1.15,1.15);
  else if(k==='ArrowUp')G.aim.gy=clamp(G.aim.gy+st,0,1.18);else if(k==='ArrowDown')G.aim.gy=clamp(G.aim.gy-st,0,1.18);
  else if(k===' '||k==='Enter'){if(G.phase==='aim'){G.phase='power';G.powT=0}else strike()}
  else return;
  e.preventDefault();
 }else if(G.turn==='them'&&(G.phase==='cpurun'||G.phase==='flight')){
  const cur=G.dive||{col:0,high:false};
  if(k==='ArrowLeft')pickDive(-1,cur.high);else if(k==='ArrowRight')pickDive(1,cur.high);
  else if(k==='ArrowUp')pickDive(cur.col,true);else if(k==='ArrowDown')pickDive(cur.col,false);
  else return;e.preventDefault();
 }
});

// ---------- update ----------
function update(dt){
 if(!G)return;G.t+=dt;
 if(G.phase==='intro'&&G.t>1.6)nextKick();
 else if(G.phase==='power'){G.powT+=dt;const ph=(G.powT/G.diff.meter)%2;G.pow=ph<1?ph:2-ph}
 else if(G.phase==='runup'&&G.t>.42)launch();
 else if(G.phase==='cpurun'&&G.t>1.7)launch();
 else if(G.phase==='flight'){
  const s=G.shot,k=Math.min(1,G.t/s.fl);const end=toPx(s.gx,s.gy);
  G.ball.x=lerp(G.from.x,end.x,k);G.ball.y=lerp(G.from.y,end.y,k)-Math.sin(k*Math.PI)*s.gy*26;G.ball.r=lerp(8,5,k);
  if(k>=1)resolve();
 }else if(G.phase==='result'){
  const b=G.bounce;b.vy+=(b.net?60:260)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.net){b.vx*=.9;b.vy*=.9}
  G.ball.x=b.x;G.ball.y=b.y;if(b.away)G.ball.r=Math.max(2,G.ball.r-dt*3);
  if(G.t>1.6)afterResult();
 }
}

  showOv(`<div class="row"><button class="btn" id="save" ${sel.length===5?'':'disabled'}>Save lineup</button><button class="btn ghost" id="cancel">Cancel</button></div>
  <h2>Pick 5 shooters</h2><p class="muted">Tap players in the order you want them to shoot (${sel.length}/5). In sudden death the rest of the team goes next, best shooters first.</p>
  <div class="grid">${SHOOTERS.map(p=>{const i=sel.indexOf(p.id);return `<button class="pick${i>=0?' on':''}" data-id="${p.id}"><span class="num">#${p.n}</span><span>${esc(p.name)}</span><span class="meta">${POSN[p.pos]} · ${p.yr} · Shot ${p.shot}</span>${i>=0?`<span class="ord">${i+1}</span>`:''}</button>`}).join('')}</div>
  <h2>Pick your keeper</h2>
  <div class="grid">${KEEPERS.map(p=>`<button class="pick keep${p.id===kp?' on':''}" data-id="${p.id}"><span class="num">#${p.n}</span><span>${esc(p.name)}</span><span class="meta">${p.yr} · Keeping ${p.keep}</span>${p.id===kp?'<span class="ord">GK</span>':''}</button>`).join('')}</div>`);
  document.getElementById('cancel').onclick=done;
  document.getElementById('save').onclick=()=>{order=sel;keeperId=kp;store.set('gss_order',order);store.set('gss_keeper',kp);done()};
  ov.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{const id=b.dataset.id;const y=ov.scrollTop;
   if(b.classList.contains('keep'))kp=id;else{const i=sel.indexOf(id);if(i>=0)sel.splice(i,1);else if(sel.length<5)sel.push(id)}
   render();ov.scrollTop=y});
 };
 render();
}
function showEnd(won,champ){
 const {a,b}=counts();
 const log=G.kicks.map(k=>{const us=k.team==='us';const good=k.res==='goal';const who=us?`#${k.who.n} ${esc(k.who.name)}`:`${esc(G.opp.short)} #${k.who.n}`;const what={goal:'Scored',save:us?'Saved':'Saved by '+esc(byId(keeperId).last),wide:'Wide',over:'Over the bar',post:'Off the post'}[k.res];return `<span>${who}</span><span class="${good?(us?'g':'x'):(us?'x':'g')}">${what}</span>`}).join('');
 let title=won?'FLYERS WIN!':'FLYERS FALL';let sub=`${a}-${b} on penalties vs ${esc(G.opp.name)}`;
 let btns='';
 if(run){
  if(champ){title='CHSAA CHAMPS!';sub+='. The Flyers win the title!';btns=`<button class="btn" id="again">New playoff run</button>`}
  else if(won){btns=`<button class="btn" id="next">Next: ${ROUNDS[run.round]}</button>`}
  else{sub+=`. Out in the ${ROUNDS[run.round].toLowerCase()}.`;btns=`<button class="btn" id="again">New playoff run</button>`}
 }else btns=`<button class="btn" id="rematch">Rematch</button><button class="btn ghost" id="other">New opponent</button>`;
 G=null;
 showOv(`<p class="big">${title}</p><p>${sub}</p><div class="row">${btns}<button class="btn ghost" id="menu">Menu</button></div>
 <div class="box"><h3>Kick by kick</h3><div class="kicklog">${log}</div></div>`);
 const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
 on('next',playRound);on('menu',menu);on('other',pickOpp);
 on('rematch',()=>newShootout(lastOpp,'REMATCH'));
 on('again',()=>{const opps=[...TEAMS].sort(()=>Math.random()-.5).slice(0,3).sort((a,b)=>a.str-b.str);run={opps,round:0};playRound()});
}
document.getElementById('quit').onclick=()=>{if(confirm('Quit this shootout?'))menu()};
menu();
</script>
