<!doctype html>
<html lang="en">
<head>

<title>Gold Star Lacrosse</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one column. Menus are plain responsive pages; in a game the 16:9 pixel canvas sits on top with the action bar under it. Same red-and-gold look as Gold Star Gridiron. */
:root{
  --night:#8f1229;      /* page ground: Chaminade red */
  --night-2:#ad1c37;    /* raised panels, a brighter red */
  --line:#e0aa2e;       /* panel borders: gold */
  --deep:#6a0b1e;       /* inputs and secondary buttons */
  --crimson:#4a0612;    /* dark red for shadows */
  --crimson-hi:#c93652;
  --gold:#ffc72c;       /* Chaminade gold, brightened */
  --chalk:#fff8e8;      /* text */
  --dim:#ffe2a8;        /* secondary text: pale yellow */
  --turf:#3c8a3a;
  --good:#b6ff9e; --bad:#ffd0d0;
  --f-display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:linear-gradient(180deg,#a5172f 0,#8f1229 320px,#7d0f23 100%) fixed var(--night);color:var(--chalk);font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0;padding-inline:16px;padding-block:12px;-webkit-tap-highlight-color:transparent;font-variant-ligatures:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
button,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.btn{font-family:var(--f-display);font-size:12px;line-height:1;padding:14px 16px;border:0;border-radius:0;background:var(--gold);color:#5a0d1c;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px var(--night),0 0 0 5px #fff3c4;cursor:pointer;text-transform:uppercase}
.btn:hover{background:#ffd65c}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 3px var(--night),0 0 0 5px #fff3c4}
.btn:focus-visible,select:focus-visible{outline:3px dashed var(--gold);outline-offset:6px}
.btn.alt{background:var(--deep);color:var(--chalk);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 0 0 3px var(--night),0 0 0 5px var(--gold)}
.btn.alt:hover{background:#86122b}
.btn.gold{background:#fff1b8;color:#5a0d1c}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.panel{background:var(--night-2);border:2px solid var(--line);padding:16px;min-width:0}
.eyebrow{font-family:var(--f-display);font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.dim{color:var(--dim)}
.small{font-size:15px}
.tnum{font-variant-numeric:tabular-nums}

/* Title screen */
.hero{display:grid;gap:18px;padding-block:8px}
.marquee{position:relative;overflow:hidden;border:4px solid var(--gold);background:repeating-linear-gradient(135deg,rgba(255,199,44,.07) 0 14px,transparent 14px 28px),linear-gradient(#c22540,#8f1229);padding:22px 18px 18px}
.marquee h1{font-size:clamp(22px,5.4vw,46px);line-height:1.15;color:var(--gold);text-shadow:4px 4px 0 var(--crimson)}
.marquee p{max-width:60ch;margin:12px 0 0;position:relative}
.stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
.menu{display:flex;flex-wrap:wrap;gap:18px;padding:6px}

/* Season hub */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.next{display:flex;flex-direction:column;gap:12px}
.vs{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip{display:inline-block;width:16px;height:16px;border:2px solid var(--chalk);vertical-align:middle}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-size:9px;color:var(--dim);font-weight:400;letter-spacing:.08em}
tr.us td{color:var(--gold)}
td.res-w{color:var(--good)} td.res-l{color:var(--bad)}

/* Roster */
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.lineup label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}
.lineup select{background:var(--deep);border:2px solid var(--line);padding:6px;font-size:16px;color:var(--chalk);width:100%}
td.note{white-space:normal;min-width:200px;color:var(--gold);font-size:14px}

/* Game */
#game{display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;max-height:calc(100vh - 170px);margin:0 auto;background:#000;border:3px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
@media (max-height:520px){.stage{max-height:calc(100vh - 96px)}}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;min-height:56px;padding:4px 0}
.playbook{display:flex;flex-wrap:wrap;gap:6px;width:100%;justify-content:center}
.pbtn{font-family:var(--f-display);font-size:9px;line-height:1.2;padding:9px 10px;background:var(--night-2);border:2px solid var(--line);color:var(--chalk);cursor:pointer;display:flex;gap:6px;align-items:center}
.pbtn .k{color:var(--dim)}
.pbtn.run{border-color:#9be38f}
.pbtn:hover{border-color:var(--gold)}
.pbtn{background:var(--deep)}
.pbtn.on{background:var(--gold);color:#5a0d1c;border-color:var(--gold)}
.pbtn.on .k{color:#5a4010}
.pbtn:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
.bar .info{font-size:16px;color:var(--dim);flex:1 1 220px;min-width:0}
.bar .info b{color:var(--chalk);font-weight:600}
.drive{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.drive .big{font-family:var(--f-display);font-size:14px;color:var(--gold)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.iconbtn{font-family:var(--f-display);font-size:10px;padding:8px 10px;background:var(--deep);border:2px solid var(--line);cursor:pointer;color:var(--chalk)}
.iconbtn:hover{background:#86122b}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.boxscore td:first-child{color:var(--dim)}
.howto li{margin-bottom:6px}
.howto{max-width:68ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Lacrosse action buttons under the field */
.abtn{font-family:var(--f-display);font-size:11px;line-height:1.2;padding:14px 14px;background:var(--deep);border:2px solid var(--line);color:var(--chalk);cursor:pointer;display:flex;gap:8px;align-items:center;min-width:88px;justify-content:center;touch-action:manipulation}
.abtn .k{color:var(--dim);font-size:9px}
.abtn.hot{background:var(--crimson-hi);border-color:var(--gold)}
.abtn.gold{background:var(--gold);color:#5a0d1c;border-color:#fff3c4}
.abtn.gold .k{color:#7a4a10}
.abtn:active{transform:translateY(2px)}
.abtn.tired{animation:tiredPulse 1s steps(2) infinite}
@keyframes tiredPulse{50%{background:#c93652;border-color:#fff3c4}}
/* Substitution box (line changes) */
.subbox{position:fixed;inset:0;z-index:20;background:rgba(40,4,12,.82);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:12px 16px 24px}
.subbox .panel{width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.subp{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;font-size:16px;line-height:1.2;color:var(--chalk);background:var(--deep);border:2px solid var(--line);padding:8px 10px;cursor:pointer;min-width:0}
.subp:hover{background:#86122b}
.subp.sel{background:var(--gold);color:#5a0d1c;border-color:#fff3c4}
.subp .nm{display:flex;justify-content:space-between;gap:8px}
.subp .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subp .pos{font-size:14px;opacity:.85}
.ebar{height:8px;background:#2a0710;border:1px solid rgba(0,0,0,.4)}
.ebar i{display:block;height:100%}
.subp:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
.abtn:focus-visible,.iconbtn:focus-visible{outline:3px dashed var(--gold);outline-offset:6px}
.trainpick{background:var(--deep);border:2px solid var(--line);padding:6px;font-size:16px;color:var(--chalk);width:100%;max-width:420px}
</style>
</head>

  33:"Providence",12:"Scranton",7:"Stony Brook",32:"Fairfield",34:"Hobart",13:"Merchant Marine Academy",14:"Fairfield",36:"Iona"};

{const k=ROSTER.find(p=>p.num===24);if(k){Object.assign(k,{spd:92,stk:91,sht:89,pow:90,fixedStars:3})}}

  g.fillStyle="#f4f4ec";
  const hl=(x0,x1,y)=>g.fillRect(X(x0),Y(y),X(x1)-X(x0),1),vl=(x,y0,y1)=>g.fillRect(X(x),Y(y0),1,Y(y1)-Y(y0));
  // boundary
  g.fillRect(X(0),Y(0),X(FL)-X(0),2);g.fillRect(X(0),Y(FWD)-2,X(FL)-X(0),2);g.fillRect(X(0),Y(0),2,Y(FWD)-Y(0));g.fillRect(X(FL)-2,Y(0),2,Y(FWD)-Y(0));

  // midfield logo with the faceoff X on top

  g.fillStyle="#f4f4ec";for(let i=-2;i<=2;i++){g.fillRect(X(MID)+i,Y(GY)+i,1,1);g.fillRect(X(MID)+i,Y(GY)-i,1,1)}

  g.fillText(isGS?"CHAMINADE":homeKey?home.name.toUpperCase():"",X(MID),Y(FWD-4.5));

function fogoStarts(){const n=G.fogoC.num,l=G.line;return [...l.A,l.M[1],l.M[2],...l.D,save.lineup.G].includes(n)}
function setupFaceoff(){
  autoSubs();

  for(const e of G.ents){

function wob(e,a,ph=0){return Math.sin(G.time*(1.5+e.slot*.23)+e.slot*2.1+(e.team==="C"?0:1.3)+ph*1.7)*a}

function updateLoose(dt){

function looseFrom(x,y,vx,vy){G.ball={st:"loose",x,y,h:0.6,vx,vy};G.poss=null}

  if(ev.target&&ev.target.tagName==="BUTTON"&&(ev.code==="Space"||ev.code==="Enter"))return;
  const first=!input.keys[ev.code];input.keys[ev.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(ev.code))ev.preventDefault();
  if(!first)return;
  if(G.phase==="fo"&&(ev.code==="Space"||ev.code==="Enter")){clamp_();return}
  if(G.phase==="intro"&&(ev.code==="Space"||ev.code==="Enter")){G.introT=0;return}
  if(G.phase==="break"&&(ev.code==="Space"||ev.code==="Enter")){nextPeriod();return}
  if(G.phase==="shot"){if(ev.code==="Space"||ev.code==="Enter"||ev.code==="KeyF")shotTap();return}
  if(G.phase==="dodge"){if(ev.code==="ArrowLeft"||ev.code==="KeyA")dodgeSide(-1);else if(ev.code==="ArrowRight"||ev.code==="KeyD")dodgeSide(1);
    else{const m=DODGES.find(x=>ev.code==="Digit"+x.key||ev.code==="Numpad"+x.key);if(m)doDodge(m.k)}return}
  if(G.phase!=="live")return;
  const c=carrier(),mine=c&&c===G.ctrl;
  if(ev.code==="Space"){if(mine)actPass(userDir()||{x:1,y:0});else actCheck()}
  if(ev.code==="KeyF"){if(mine)actShoot()}
  if(ev.code==="KeyR"||ev.code==="KeyH"){if(!mine)actHit()}
  if(ev.code==="KeyE"||ev.code==="KeyQ"){if(mine){const d=userDir();d&&(d.x||d.y)?actDodge(d.x,d.y):actDodge()}else actSwitch()}
});
addEventListener("keyup",ev=>{input.keys[ev.code]=false});
addEventListener("blur",()=>{input.keys={};input.down=false;input.sprintBtn=false});
addEventListener("pointerup",()=>{input.sprintBtn=false});addEventListener("pointercancel",()=>{input.sprintBtn=false});

/* ============================================================
   BAR UNDER THE FIELD
   ============================================================ */
let barKey="";
function barMode(){
  if(!G)return"";
  if(G.phase==="shot")return"shot"+(G.sm?G.sm.stage:"");
  if(G.phase==="dodge")return"dodge"+(G.dv?G.dv.stage+"|"+G.dv.side:"");
  if(G.phase==="live"){const c=carrier();if(c&&c===G.ctrl)return"off";if(c&&c.team==="C")return"clear";if(c)return"def";return"loose"}
  return G.phase+(G.phase==="fo"?G.fo.stage+G.fo.done:"");
}
const AB=(id,label,key,cls="")=>`<button type="button" class="abtn ${cls}" id="${id}">${label}<span class="k">${key}</span></button>`;
function renderBar(force){
  const bar=$("#bar");if(!G){bar.innerHTML="";barKey="";return}
  const m=barMode();if(!force&&m===barKey)return;barKey=m;
  const on=(id,fn)=>{const b=$("#"+id);if(b)b.onclick=ev=>{fn();b.blur();renderBar(true)}};
  const subsBtn=()=>{const b=$("#a-subs");if(b)b.onclick=ev=>{b.blur();openSubs()}};
  const SUBS=AB("a-subs","Subs","X");
  const sprintBtn=()=>{subsBtn();const b=$("#a-sprint");if(b){b.onpointerdown=ev=>{ev.preventDefault();input.sprintBtn=true};b.oncontextmenu=ev=>ev.preventDefault()}};
  if(m==="off"){bar.innerHTML=`${AB("a-pass","Pass","SPACE")}${AB("a-shoot","Shoot","F","hot")}${AB("a-dodge","Dodge","E")}${AB("a-sprint","Sprint","HOLD SHIFT","gold")}${SUBS}<div class="info">He runs on his own. Drag back from him to throw: aim near a teammate to lock on, and let go when the pass meter is in the green. Hold the field to steer, swipe to dodge, tap the cage to shoot.</div>`;
    on("a-pass",()=>actPass(userDir()||{x:1,y:0}));on("a-shoot",()=>actShoot());on("a-dodge",()=>actDodge());sprintBtn()}
  else if(m==="def"){bar.innerHTML=`${AB("a-check","Check","SPACE","hot")}${AB("a-hit","Hit","R","hot")}${AB("a-sprint","Sprint","HOLD SHIFT","gold")}${AB("a-switch","Switch","E")}${SUBS}<div class="info">Check to knock the ball out of his stick. Hit (or swipe the field) to lay him out with your shoulder. Land it and he goes down, miss and you do. Poles check and hit harder.</div>`;
    on("a-check",actCheck);on("a-hit",actHit);on("a-switch",actSwitch);sprintBtn()}
  else if(m==="loose"){bar.innerHTML=`${AB("a-hit","Hit","R")}${AB("a-sprint","Sprint","HOLD SHIFT","gold")}${AB("a-switch","Switch","E")}${SUBS}<div class="info"><b>Ground ball!</b> Run over it to scoop it up. You can hit anyone within 5 yards of a loose ball.</div>`;on("a-hit",actHit);on("a-switch",actSwitch);sprintBtn()}
  else if(m.startsWith("shot")){const st=G.sm?G.sm.stage:0;bar.innerHTML=st>1?`<div class="info">&nbsp;</div>`:`${AB("a-shot",st===0?"Power":"Shoot","SPACE","gold")}<div class="info">${st===0?"Tap when the power bar is full. More power means less time for the goalie.":"Drag on the net to aim (arrow keys work too) and let go to shoot. The goalie slides toward where you're looking, and your aim wobbles more from far out or with a defender on you."}</div>`;
    const b=$("#a-shot");if(b)b.onpointerdown=ev=>{ev.preventDefault();shotTap()}}
  else if(m.startsWith("dodge")){const v=G.dv;
    bar.innerHTML=!v||v.stage?`<div class="info">&nbsp;</div>`:`${AB("d-left","◀ Left","A",v.side<0?"gold":"")}${AB("d-right","Right ▶","D",v.side>0?"gold":"")}${DODGES.map(x=>AB("d-"+x.k,x.name.toLowerCase().replace(/^./,s=>s.toUpperCase()),x.key,"hot")).join("")}<div class="info">Read his tell, pick a side, then pick your move. Stick up: swim. Hands out: roll. Sitting back: switch hands. Go away from his lean.</div>`;
    const b=(id,fn)=>{const e=$("#"+id);if(e)e.onpointerdown=ev=>{ev.preventDefault();fn()}};
    b("d-left",()=>dodgeSide(-1));b("d-right",()=>dodgeSide(1));DODGES.forEach(x=>b("d-"+x.k,()=>doDodge(x.k)))}
  else if(m==="clear"){bar.innerHTML=`${SUBS}<div class="info">Your goalie has it and is looking for an outlet pass.</div>`;subsBtn()}
  else if(G.phase==="fo"){const f=G.fo;bar.innerHTML=f.done?`<div class="info">&nbsp;</div>`:`${AB("a-clamp","Clamp","SPACE","gold")}${f.stage!=="go"?SUBS:""}<div class="info"><b>Faceoff.</b> ${esc(G.fogoC.name)} is at the X. Tap the field or press Space the moment the whistle blows. Go early and it's a violation.</div>`;
    const b=$("#a-clamp");if(b)b.onpointerdown=ev=>{ev.preventDefault();clamp_()};subsBtn()}
  else if(G.phase==="break"){bar.innerHTML=`<div class="info">${esc(G.breakMsg)}. Shots ${G.st.C.sh}-${G.st.O.sh}, saves ${G.st.C.sv}-${G.st.O.sv}, ground balls ${G.st.C.gb}-${G.st.O.gb}.</div>${SUBS}<button class="btn gold" id="c-next" type="button">${G.q>=4?"Start overtime":G.q===2?"Start 2nd half":"Start Q"+(G.q+1)}</button>`;on("c-next",nextPeriod);subsBtn()}
  else if(G.phase==="final"){
    const rows=Object.entries(G.ps).map(([n,s])=>({p:byNum(+n),...s})).filter(r=>r.p&&(r.g||r.a||r.gb||r.ct||r.sv)).sort((a,z)=>(z.g*2+z.a)-(a.g*2+a.a)).slice(0,5);
    const line_=rows.map(r=>`<b>${esc(r.p.last)}</b> `+[r.g?r.g+" G":"",r.a?r.a+" A":"",r.sv?r.sv+" saves":"",r.gb?r.gb+" GB":"",r.ct?r.ct+" CT":""].filter(Boolean).join(", ")).join(" · ");
    bar.innerHTML=`<div class="info small">Shots ${G.st.C.sh}-${G.st.O.sh} · Faceoffs ${G.st.C.fo}-${G.st.O.fo} · Ground balls ${G.st.C.gb}-${G.st.O.gb}${line_?"<br>"+line_:""}</div><button class="btn" id="c-done" type="button">Continue</button>`;
    $("#c-done").onclick=()=>{const t=G.ctx.type;G=null;showMenu(t==="quick"?"title":"season")}}
  else bar.innerHTML=`<div class="info">&nbsp;</div>`;
}

function finishGame(){
  G.phase="final";SFX.whistle();const won=G.us>G.them;if(won)SFX.goal();
  G.ccEarned=0;
  if(G.ctx.type==="season"){G.ccEarned=(won?3:1)+(G.us>=12?1:0);save.cc+=G.ccEarned;recordSeasonGame(G.us,G.them,G.ot);addSeasonStats()}

}

function simScore(oppKey){const o=TEAMS[oppKey].r,c=TEAMS.CHAM.r+(save.up.fo||0)+(save.up.gk||0);
  let a=Math.max(2,Math.round(rnd(7,14)+(c-o)/2.5)),b=Math.max(2,Math.round(rnd(7,14)+(o-c)/2.5));if(a===b){Math.random()<.5?a++:b++}return[a,b]}
function recordSeasonGame(us,them,ot){

}
function addSeasonStats(){const T=save.season.stats;for(const n in G.ps){const t=T[n]||(T[n]={});for(const k in G.ps[n])t[k]=(t[k]||0)+G.ps[n][k]}writeSave()}

function renderHowto(){
  $("#menu").innerHTML=`<div class="topline"><h2 style="font-size:14px">HOW TO PLAY</h2><button class="iconbtn" id="h-back" type="button">BACK</button></div>
  <div class="panel howto"><ol>
    <li><b>Faceoff.</b> Every quarter and every goal starts at the X. Wait for DOWN, then SET, then tap (or press Space) the instant the WHISTLE shows. Beat their FOGO to the clamp and the ball is yours. Go early and it's a violation. A dead heat squirts out as a ground ball.</li>
    <li><b>Run.</b> Like Retro Bowl, your ball carrier runs on his own: up the field, then around the top of the attack. Hold your finger on the field to steer him toward it. Keys: arrows or WASD. The Flyers attack the cage on the right.</li>
    <li><b>Throw.</b> Put your finger on your player, drag back, and let go. Aim near a teammate and the pass locks on to him (gold arrow). The pass meter shows how hard you're pulling: let go in the green band for a pinpoint pass. A quick flick is a fast, flat bullet. A slow pull floats a lob over sticks. You can also tap a teammate, or press Space for the most open man.</li>
    <li><b>Shoot.</b> Tap the cage (or press F, or the Shoot button) to wind up. First tap when the power bar is full. Then the view switches to first person, looking at the cage: drag anywhere on the net to aim and let go to shoot (arrow keys and Space work too). The goalie slides toward wherever you're aiming, so pick a corner late. Your aim wobbles more from far out or with a defender on you, and a soft shot gives him time to react. You can't score from behind the goal.</li>
    <li><b>Dodge moves.</b> With a defender on you, tap Dodge (or swipe, or press E) and the view switches to first person, face to face with him. Read his tell: stick up means he wants to check, so swim dodge over it. Hands out means he wants to push, so roll dodge off him. Sitting back means he's waiting, so switch hands and change direction. Pick Left or Right (arrows or A/D), going away from the way he leans, then pick your move (or press 1, 2, 3) before the timer runs out. Beat him and he's left behind. Guess wrong and he can strip you.</li>
    <li><b>Shooting range.</b> From outside the white restraining line a shot almost never goes in. The closer you get to the cage, the easier it is to score.</li>
    <li><b>Sprint.</b> With nobody on you, a dodge is a quick burst. A sharp split dodge can leave your defender a step behind. Hold the Sprint button (or Shift) for a speed boost. It drains the green BOOST meter and refills when you let go.</li>
    <li><b>Subs.</b> Every Flyer on the field has an energy bar. It drains while he plays, faster when he sprints, and a tired player runs slower. When the Subs button flashes, someone is gassed. Tap Subs (or press X) to pause and open the line changes box: tap a player to take him out, then pick who goes in. Players get their energy back on the bench. Turn on Auto subs and tired players come off by themselves. The other team changes lines too.</li>
    <li><b>Ground balls.</b> When the ball is loose, run over it to scoop it. Ground balls win games.</li>
    <li><b>Defense.</b> You control the Flyer closest to the ball. Get on the carrier and tap near him (or press Space) to throw a check. Swipe the field (or press R, or the Hit button) to throw a body hit: land it and he goes down and usually loses the ball, whiff or bounce off and you hit the turf. You can also hit anyone within 5 yards of a loose ball. Poles check and hit harder. Tap another Flyer, or press E, to switch. Watch out, their defenders hit too.</li>
    <li><b>Out of bounds.</b> On a missed shot, the team closest to the ball where it goes out gets it, like the real backing-up rule. Anything else goes to the other team.</li>
    <li><b>Overtime.</b> Tied after four quarters means sudden victory. Next goal wins.</li>
    <li><b>Front office.</b> Season wins earn coaching credits. Spend them to train starters or hire a faceoff coach and a goalie coach.</li>
  </ol><p class="dim small">Turn your phone sideways for the biggest field.</p></div>`;
  $("#h-back").onclick=()=>showMenu("title");
}
/* ---------- front office ---------- */
function starVal(p){const r=k=>R(p,k);return p.k==="G"?r("sav")+2:p.k==="FO"?r("fo"):p.k==="A"?(r("stk")+r("sht"))/2:p.pole?(r("pow")+r("spd"))/2:p.k==="SSDM"?(r("spd")+r("stk")+r("pow"))/3:(r("spd")+r("stk")+r("sht"))/3}
function stars(p){if(p.fixedStars)return p.fixedStars;return clamp(Math.round((starVal(p)-60)/6),1,5)}
function starStr(p){const n=stars(p);return"★".repeat(n)+"☆".repeat(5-n)}
function trainCost(p){const t=save.train[p.num]||{};const n=Object.values(t).reduce((a,b)=>a+b,0)/3;return 2+Math.floor(n/2)}
let anyPick=1;
function renderOffice(){
  const L=save.lineup,slots=[...L.A.map((n,i)=>["Attack "+(i+1),n]),...L.M.map((n,i)=>["Midfield "+(i+1),n]),...L.D.map((n,i)=>["Defense "+(i+1),n]),["Goalie",L.G],["FOGO",L.FO]];
  const attrs=(p,slot)=>slot==="Goalie"||p.k==="G"?["sav","stk","spd"]:slot==="FOGO"||p.k==="FO"?["fo","stk","spd"]:p.pole||/^Defense/.test(slot)?["spd","stk","pow"]:["spd","stk","sht","pow"];
  const name={spd:"Speed",stk:"Stick",sht:"Shot",pow:"Check / hit",sav:"Saves",fo:"Faceoff"};
  const card=([slot,n])=>{const p=byNum(n),c=trainCost(p);
    return`<div class="panel" style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">${slot}</div>
      <div class="row" style="gap:10px">${iconImg(p,48)}<div><b>#${p.num} ${esc(p.name)}</b> <span class="dim small">${esc(p.pos)} · ${p.cls}</span></div></div>
      <div style="color:var(--gold);font-size:20px;letter-spacing:2px">${starStr(p)}</div>
      ${attrs(p,slot).map(k=>`<div class="row" style="justify-content:space-between;gap:8px"><span class="small">${name[k]} <b class="tnum">${R(p,k)}</b></span><button class="iconbtn" type="button" data-train="${p.num}" data-attr="${k}" ${save.cc<c||R(p,k)>=99?"disabled":""}>+3 · ${c} CC</button></div>`).join("")}</div>`};
  const cards=slots.map(card).join("");
  const up=[["fo","Faceoff coach","Your FOGO gets to the clamp a little faster at every level."],["gk","Goalie coach","Your goalie tracks shots better and makes more saves."]];
  const COST=[4,6,8];
  const staff=up.map(([k,t,d])=>{const lv=save.up[k]||0,c=COST[lv];return`<div class="panel" style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">${t}</div><div class="small">${d}</div><div class="tnum">Level ${lv} / 3</div>${lv<3?`<button class="btn alt" type="button" data-up="${k}" ${save.cc<c?"disabled":""}>Upgrade · ${c} CC</button>`:`<span class="dim small">Maxed out</span>`}</div>`}).join("");
  $("#menu").innerHTML=`<div class="topline"><h2 style="font-size:14px">FRONT OFFICE</h2><span class="row"><span class="disp tnum" style="font-size:12px;color:var(--gold)">${save.cc} COACHING CREDITS</span><button class="iconbtn" id="o-back" type="button">BACK</button></span></div>
  <p class="dim small">Season wins earn 3 credits, losses 1, plus 1 for scoring 12 or more. Training and staff carry over to new seasons. Stars start at each player's real recruiting rating where one is published, and training can push anyone past it.</p>
  <div class="eyebrow">Train your starters</div>
  <div class="lineup" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))">${cards}</div>
  <div class="eyebrow">Train anyone on the roster</div>
  <div class="panel" style="display:flex;flex-direction:column;gap:10px"><label for="o-any" class="small dim">Bench players can be upgraded too, so they're ready when you move them into the lineup.</label>
    <select id="o-any" class="trainpick">${ROSTER.map(p=>`<option value="${p.num}"${p.num===anyPick?" selected":""}>#${p.num} ${esc(p.name)} (${esc(p.pos)}) ${"★".repeat(stars(p))}</option>`).join("")}</select>
    <div class="lineup" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))">${card(["Selected player",anyPick])}</div></div>
  <div class="eyebrow">Coaching staff</div><div class="grid2">${staff}</div>`;
  $("#o-any").onchange=e=>{anyPick=+e.target.value;renderOffice()};
  $("#o-back").onclick=()=>showMenu(save.season?"season":"title");
  document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>{const p=byNum(+b.dataset.train),k=b.dataset.attr,c=trainCost(p);if(save.cc<c)return;save.cc-=c;const t=save.train[p.num]||(save.train[p.num]={});t[k]=(t[k]||0)+3;writeSave();SFX.catch();renderOffice()});
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const k=b.dataset.up,lv=save.up[k]||0,c=COST[lv];if(save.cc<c||lv>=3)return;save.cc-=c;save.up[k]=lv+1;writeSave();SFX.catch();renderOffice()});
}

$("#b-quit").onclick=()=>{if(!G)return;const t=G.ctx.type;G=null;showMenu(t==="quick"?"title":"season")};
$("#b-sound").onclick=()=>{save.sound=!save.sound;writeSave();$("#b-sound").textContent=save.sound?"SOUND ON":"SOUND OFF"};

/* ============================================================
   LOOP
   ============================================================ */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&!$("#game").hidden){try{const n=Math.max(1,Math.ceil(dt/(1/120)));if(!G.paused)for(let i=0;i<n&&G;i++){update(dt/n);manageCtrl()}if(G){draw();renderBar();const sb=$("#a-subs");if(sb)sb.classList.toggle("tired",anyTired())}}catch(err){console.error(err)}}
  requestAnimationFrame(frame)}
const fontsReady=document.fonts?Promise.race([document.fonts.load('16px "Press Start 2P"'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontsReady.then(()=>{showMenu("title");requestAnimationFrame(frame)});
window.__gsl={fireShot,actDodge,doDodge,dodgeSide,w2s:e=>({x:wx(e.x)*SCALE/(VW*SCALE),y:(wy(e.y)-9)*SCALE/(VH*SCALE)}),startShot,shotTap,aimPoint,get input(){return input},get G(){return G},get save(){return save},stars:p=>stars(p),ROSTER,newGame,update,clamp_,nextPeriod,manageCtrl,draw,actShoot,actPass};
})();
</script>
