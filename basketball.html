<style>
/* Layout: one 16:9 canvas court centered in a dark gym; menus are full-screen overlays; touch pads float at the bottom corners. Single dark look by choice. */
:root{
  --gym:#170505; --navy:#3a0c0c; --royal:#a3203a; --sky:#ffd96a; --white:#f3f6ff; --gold:#ffc72c; --muted:#e8b4a6; --line:rgba(255,210,63,.28);
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--gym);color:var(--white);font-family:var(--body);font-size:17px;margin:0;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
.overlay{position:fixed;inset:0;overflow-y:auto;background:radial-gradient(ellipse at 50% 0%,rgba(163,32,58,.35),transparent 60%),rgba(20,4,4,.94);z-index:5;padding-block:max(18px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-inline:16px}
.panel{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(34px,7vw,64px);line-height:.95;color:var(--white);text-shadow:0 4px 0 var(--royal),0 8px 24px rgba(0,0,0,.5)}
h1 .gold{color:var(--gold)}
h2{font-size:clamp(22px,4.2vw,34px)}
h3{font-size:18px}
.eyebrow{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);font-size:14px}
p{margin:0;line-height:1.35;max-width:62ch}
.muted{color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding-top:8px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{font-family:var(--display);font-size:17px;background:var(--royal);border:0;border-radius:10px;padding:12px 18px;color:var(--white);box-shadow:0 4px 0 #5a0d1c;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a0d1c}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none;font-family:var(--body);font-weight:700;font-size:17px;letter-spacing:.04em}
.btn.gold{background:var(--gold);color:#1a1300;box-shadow:0 4px 0 #a37a00}
.btn:focus-visible,.card:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;background:linear-gradient(160deg,#5a1010,#3a0c0c);border:2px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.mode b{font-family:var(--display);font-weight:400;font-size:20px}
.mode span{color:var(--muted);line-height:1.25}
.mode.feature{border-color:var(--gold);background:linear-gradient(160deg,#a3203a,#4a0d0d)}
.mode.feature span{color:#ffe9c2}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;background:#3f0e0e;border:2px solid transparent;border-radius:12px;padding:8px 6px;min-width:0;text-align:center}
.card canvas{width:64px;height:64px}
.card .nm{font-weight:800;font-size:17px;line-height:1.05}
.card .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.card.sel{border-color:var(--gold);background:#6b1616}
.card.taken{opacity:.35}
.bio{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#3a0c0c;border:2px solid var(--line);border-radius:14px;padding:12px}
.bio canvas{width:96px;height:96px}
.bio > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);max-width:320px}
.bar{height:9px;background:#220707;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--royal),var(--sky))}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.cform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}

.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.swatch.sel{border-color:#ffc72c}
.opt{background:#3f0e0e;border:2px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;font-size:17px}
.opt.sel{border-color:var(--gold);background:#6b1616}
.opt small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.sched{display:flex;flex-direction:column;gap:6px}
.game{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:#3a0c0c;border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.game .res{font-family:var(--display);font-size:20px;text-align:center}
.game .res.W{color:#5be38d}.game .res.L{color:#ff7b6e}
.game.next{border-color:var(--gold)}
.game .tag{color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.game .who{font-weight:800;font-size:18px}
.game .sc{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.story{background:linear-gradient(120deg,#a3203a,#5a1010);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.big-score{font-family:var(--display);font-size:clamp(40px,9vw,72px);text-align:center;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.keys > div{background:#3a0c0c;border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}

.btn.small{font-size:15px;padding:7px 12px}
.small{font-size:14px}
.foot{color:var(--muted);font-size:14px;text-align:center;line-height:1.35}
.foot a{color:var(--sky)}
#touch{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px max(12px,env(safe-area-inset-bottom,0px));pointer-events:none}
#touch .pad{display:flex;gap:10px;pointer-events:auto}
#touch .pad button{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(163,32,58,.32);color:#fff;font-family:var(--display);font-size:15px;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch .pad button.shoot{background:rgba(255,198,41,.45);color:#1a1300}
#touch .pad button.steal{background:rgba(61,220,132,.38)}
#touch .pad button.on{background:rgba(255,255,255,.55)}
#touch.two .pad{gap:6px}
#touch.two .pad button{width:50px;height:50px;font-size:10px}
@media (max-width:600px){#touch:not(.two) .pad:last-child{flex-wrap:wrap;justify-content:flex-end;max-width:196px;gap:8px}#touch:not(.two) .pad button{width:54px;height:54px;font-size:11px}}
.binds{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;margin:10px 0}
.binds .bk{font-family:var(--body);font-weight:800;background:#6b1616;color:#fff;border:2px solid #220707;border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0}
.binds .bk.wait{background:#ffc72c;color:#1a1300}
#menuBtn{position:fixed;bottom:max(10px,env(safe-area-inset-bottom,0px));left:calc(50% - 34px);transform:translateX(-100%);z-index:4;background:rgba(58,12,12,.8);border:2px solid var(--line);border-radius:10px;color:#fff;font-weight:800;padding:6px 12px}
#pauseBtn{position:fixed;bottom:max(10px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:4;background:rgba(58,12,12,.8);border:2px solid var(--line);border-radius:10px;color:#fff;font-weight:800;padding:6px 12px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>

{const ed=store.get('fhh_stats',{});for(const id in ed){const p=ROSTER.find(q=>q.id===id);if(p&&!p.custom&&ed[id].reduce((a,b)=>a+b,0)<=BASE_S[id].reduce((a,b)=>a+b,0))p.s=[...ed[id]]}}

function tone(f,d,type='sine',vol=.18,slide=0){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}

function hairPath(c,r,st){

 if(st===1||st===7)crop(.62);
 else if(st===4){c.moveTo(-r*1.02,r*.3);c.bezierCurveTo(-r*1.12,-r*1.25,r*1.12,-r*1.25,r*1.02,r*.3);c.lineTo(r*.86,r*.3);c.quadraticCurveTo(r*.85,-r*.4,r*.2,-r*.5);c.quadraticCurveTo(-r*.6,-r*.5,-r*.86,r*.3);c.closePath()}

 // cheeks

function savePhoto(id,file,done){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const S=180,k=document.createElement('canvas');k.width=k.height=S;const m=Math.min(im.width,im.height);k.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);const url=k.toDataURL('image/jpeg',.85);store.set('fhh_photo_'+id,url);const o=new Image();o.onload=()=>{headCache.clear();done()};o.src=url;PHOTOS[id]=o};im.onerror=()=>done('That file could not be read as an image.');im.src=fr.result};fr.readAsDataURL(file)}

 for(let i=0;i<6;i++){const x=80+i*160;const lg=b.createRadialGradient(x,0,0,x,0,140);lg.addColorStop(0,'rgba(255,255,230,.22)');lg.addColorStop(1,'rgba(255,255,230,0)');b.fillStyle=lg;b.fillRect(x-140,0,280,140)}

 f.font='700 14px "Barlow Condensed", Arial, sans-serif';f.fillStyle='#ffe7a8';f.fillText('MINEOLA, NY',170,FLOOR-48);f.fillText('MINEOLA, NY',W-170,FLOOR-48);
 const fg=f.createLinearGradient(0,FLOOR-34,0,H);fg.addColorStop(0,'#e7b47a');fg.addColorStop(1,'#b97d45');f.fillStyle=fg;f.fillRect(0,FLOOR-34,W,H-FLOOR+34);

 f.fillStyle='rgba(163,32,58,.75)';f.fillRect(0,FLOOR-34,200,H);f.fillRect(W-200,FLOOR-34,200,H);

function drawBackground(t){

 if(hype>.05){ctx.drawImage(L.back,0,0,W,H);L.crowdL.forEach((c,k)=>ctx.drawImage(c,0,L.CY+Math.sin(t*9+k*2.1)*hype*6,W,L.CH))}

 {const r=ov.querySelector('#r-g');r.addEventListener('input',()=>{c.g=+r.value;ov.querySelector('#v-g').textContent=c.g+'%';ov.querySelector('#t-g').textContent=gtag(c.g);store.set('fhh_custom_lvl',c);applyCustom()})}

function howTo(){
 show(`<div class="eyebrow">How to play</div><h2>Get buckets. Get stops.</h2>
 <div class="keys">
  ${[0,1].map(i=>`<div><h3>Player ${i+1}</h3><p>Move ${kb(i,'l')} ${kb(i,'r')} · Jump ${kb(i,'j')} · Shoot (hold) ${kb(i,'s')} · Pump fake ${kb(i,'f')} · Crossover ${kb(i,'x')} · Stepback ${kb(i,'b')} · Steal ${kb(i,'t')}</p>${i?'':`<p class="muted">Playing the CPU? Player 2's keys work too. Change any key under Controls.</p>`}</div>`).join('')}
  <div><h3>On a phone</h3><p>Use the on-screen buttons. Turn your phone sideways for the biggest court.</p></div>
 </div>
 <div class="keys">
  <div><h3>Shoot</h3><p>Grab the ball by touching it. Hold shoot to fill the shot meter and let go while it's in the green. Only a green release goes in; early or late is a miss. The green is biggest at the rim and shrinks the farther out you are. Jump shots and better shooters get a bit more green, and a defender in your face takes some away. Shots from past the 3PT line count for three.</p></div>
  <div><h3>Dunk</h3><p>Drive to the rim with the ball and jump. Get up near the rim and you'll throw down a tomahawk, windmill or two-hand jam, then hang on the rim.</p></div>
  <div><h3>2 on 2</h3><p>Press steal while you have the ball to pass to your teammate. With a CPU teammate you always control whoever has the ball. Defenders can pick off a lazy pass.</p></div>
  <div><h3>Pump fake, crossover and stepback</h3><p>With the ball, pump fake to sell a shot and get a CPU defender to jump. Crossover whips the ball to your other hand with a quick burst and can leave a defender stumbling the wrong way. Stepback hops you away from your defender for room to shoot. They all work less and less on the harder levels.</p></div>
  <div><h3>Burst</h3><p>Double-tap left or right to burst for a short sprint. It recharges in about a second.</p></div>
  <div><h3>Defend</h3><p>Press steal next to the ball handler to swipe at the ball. Jump into a shot to block it with your big head.</p></div>
  <div><h3>Flyer Shot</h3><p>Your Flyer Power bar fills over time and when you get scored on. When it glows, your next shot gets a huge green window, and a green release becomes a fireball. It only lasts for that one shot, made or missed, then the bar starts over.</p></div>
 </div>
 <div class="btns"><button class="btn" id="back">Back</button></div>`);
 on('#back',()=>mainMenu());
}

// stat steppers: Speed, Hops, Shooting from 1 to 5, with a point cap so nobody is maxed out everywhere
const stepHTML=(s,cap=STAT_MAX)=>`${['Speed','Hops','Shooting'].map((l,i)=>`<div class="stepr"><b>${l}</b><button data-st="${i}" data-dv="-1" aria-label="Less ${l}">−</button><div class="bar"><i style="width:${s[i]*20}%"></i></div><button data-st="${i}" data-dv="1" aria-label="More ${l}">+</button></div>`).join('')}<p class="muted small">${cap-s[0]-s[1]-s[2]} of ${cap} points left · each stat goes from 1 to 5</p>`;
const stepS=(s,i,dv,cap=STAT_MAX)=>{const v=s[i]+dv;if(v<1||v>5||(dv>0&&s[0]+s[1]+s[2]>=cap))return false;s[i]=v;return true};
function editStats(p,done){const s=[...p.s],cap=BASE_S[p.id].reduce((a,b)=>a+b,0);
 const render=()=>{show(`<div class="eyebrow">Edit stats</div><h2>#${p.n} ${esc(p.name)}</h2>${stepHTML(s,cap)}
  <div class="btns"><button class="btn gold" id="save">Save</button><button class="btn ghost" id="reset">Original stats</button><button class="btn ghost" id="back">Cancel</button></div>`);
  on('[data-st]',el=>{if(stepS(s,+el.dataset.st,+el.dataset.dv,cap))render()});
  on('#reset',()=>{s.splice(0,3,...BASE_S[p.id]);render()});
  on('#save',()=>{p.s=[...s];const ed=store.get('fhh_stats',{});ed[p.id]=[...s];store.set('fhh_stats',ed);done()});
  on('#back',()=>done())};
 render()}
function createPlayer(p,done){

 let msg='';
 const render=()=>{
  show(`<div class="eyebrow">${p?'Edit your player':'Create a player'}</div><h2>${p?esc(p.name):'New Flyer'}</h2>
  <div class="bio"><canvas width="96" height="96" id="prev"></canvas><div>
  <div class="cform"><label>First name<input id="cf" maxlength="14" value="${esc(c.first)}"></label><label>Last name<input id="cl" maxlength="14" value="${esc(c.last)}"></label>

  <label>Position<select id="cp">${Object.entries(POS).map(([k,v])=>`<option value="${k}"${k===c.pos?' selected':''}>${v}</option>`).join('')}</select></label>
  <label>Height<select id="ch">${Array.from({length:17},(_,i)=>66+i).map(i=>`<option value="${i}"${i===c.inch?' selected':''}>${htStr(i)}</option>`).join('')}</select></label>
  <label>Year<select id="cy">${['Fr','So','Jr','Sr'].map(k=>`<option value="${k}"${k===c.yr?' selected':''}>${YR[k]}</option>`).join('')}</select></label></div></div></div>
  <h3>Look</h3>
  <div class="opts">${SKINS.map((k,i)=>`<button class="swatch${i===c.skin?' sel':''}" data-sk="${i}" style="background:${k[0]}" aria-label="Skin tone ${i+1}"></button>`).join('')}</div>
  <div class="opts" style="margin-top:8px">${HAIRS.map((k,i)=>`<button class="swatch${i===c.hair?' sel':''}" data-hr="${i}" style="background:${k}" aria-label="Hair color ${i+1}"></button>`).join('')}</div>

  <p class="err" style="color:#ff9b8e;font-weight:700;min-height:1.2em">${msg}</p>

  const cv=ov.querySelector('#prev'),d=Math.min(2,devicePixelRatio||1);cv.width=96*d;cv.height=96*d;const x=cv.getContext('2d');x.scale(d,d);
  const draw=()=>{const lk=Object.assign(lookFor((c.first||'A')+' '+(c.last||'B')),{skin:SKINS[c.skin][0],shade:SKINS[c.skin][1],hair:HAIRS[c.hair],style:c.style,band:c.band});x.clearRect(0,0,96,96);drawHead(x,48,50,38,lk,{pid:c.id,facing:1,ldx:.4,ldy:.1})};draw();
  const keep=()=>{c.first=clean(ov.querySelector('#cf').value);c.last=clean(ov.querySelector('#cl').value);c.n=ov.querySelector('#cn').value;c.pos=ov.querySelector('#cp').value;c.inch=+ov.querySelector('#ch').value;c.yr=ov.querySelector('#cy').value};
  ov.querySelectorAll('.cform input,.cform select').forEach(el=>el.addEventListener('input',()=>{keep();draw()}));
  on('[data-sk]',el=>{keep();c.skin=+el.dataset.sk;render()});on('[data-hr]',el=>{keep();c.hair=+el.dataset.hr;render()});
  on('#sty',()=>{keep();c.style=(c.style+1)%8;render()});on('#bnd',()=>{keep();c.band=!c.band;render()});
  on('[data-st]',el=>{keep();if(stepS(c.s,+el.dataset.st,+el.dataset.dv))render()});
  on('#back',()=>done());
  on('#del',el=>{if(!el.dataset.c){el.dataset.c=1;el.textContent='Tap again to delete';return}
   store.set('fhh_custom',store.get('fhh_custom',[]).filter(q=>q.id!==c.id));const i=ROSTER.findIndex(q=>q.id===c.id);if(i>=0)ROSTER.splice(i,1);removePhoto(c.id);done()});

   const i=ROSTER.findIndex(q=>q.id===c.id);if(i>=0)ROSTER.splice(i,1);headCache.clear&&headCache.clear();addCustom(c);done(c.id)});
 };render()}

  const here=()=>pickPlayer({title,sel:cur,taken,next,back});

  on('.card[data-id]',el=>{cur=el.dataset.id;const y=ov.scrollTop;render();ov.scrollTop=0});

  on('#rmph',()=>{removePhoto(cur);render()});
 };render();
}

function seasonHub(){
 let s=seasonState();
 if(s.champ&&s.i>=SEASON.length){}
 const w=s.res.filter(r=>r==='W').length,l=s.res.filter(r=>r==='L').length,p=findP(s.pid);
 const done=s.i>=SEASON.length;
 const nx=SEASON[Math.min(s.i,SEASON.length-1)];
 show(`<div class="eyebrow">Road to the Crown</div><h2>Flyers season · ${w}-${l}</h2>
 ${done?`<div class="story"><h3>${s.champ?'CHSAA CHAMPIONS':'Season complete'}</h3><p>${s.champ?`The banner is going up in Mineola. ${p.name} and the Flyers finished ${w}-${l} and won it all.`:'The season is over.'}</p></div>`:
 `<div class="story"><div class="eyebrow" style="color:#ffe9c2">${nx.tag}</div><h3>vs. ${RIVALS[nx.opp].name}</h3><p>${nx.blurb}</p><p style="color:#ffe9c2">CPU level: ${CPU[seasonLvl(nx)].name}</p></div>`}
 <div class="btns">${done?`<button class="btn gold" id="reset">Start a new season</button>`:`<button class="btn gold" id="play">Play as ${p.name}</button><button class="btn ghost" id="swap">Change Flyer</button>`}<button class="btn ghost" id="back">Main menu</button></div>
 <div class="sched">${SEASON.map((g,i)=>{const r=s.res[i],sc=s.scores[i];return`<div class="game${i===s.i?' next':''}"><div class="res ${r||''}">${r||(i===s.i?'▶':'·')}</div><div style="min-width:0"><div class="tag">${g.tag}</div><div class="who">vs. ${RIVALS[g.opp].name}</div></div><div class="sc">${sc?sc.join('-'):''}</div></div>`}).join('')}</div>
 ${!done&&s.i>0?'<div class="btns"><button class="btn ghost" id="reset">Restart season</button></div>':''}`);
 on('#play',()=>{const t=RIVALS[nx.opp];start({p1:p,p2:rivalPlayer(nx.opp),t1:nx.opp==='kell'?CHAM_W:CHAM,t2:t,cpu:seasonLvl(nx),mode:'season',tag:nx.tag.toUpperCase(),vsLine:`${nx.tag} · vs. ${t.name}`,oppKey:nx.opp,si:s.i})});
 on('#swap',()=>pickPlayer({title:'Who leads the Flyers?',sel:s.pid,next:pid=>{const q=seasonState();q.pid=pid;saveSeason(q);seasonHub()},back:()=>seasonHub()}));
 on('#reset',el=>{if(el.dataset.c){saveSeason({i:0,res:[],scores:[],pid:s.pid,champ:false});seasonHub()}else{el.dataset.c=1;el.textContent='Tap again to wipe the season'}});
 on('#back',()=>mainMenu());
}

function showResult(){
 const g=game,cfg=g.cfg,a=lead(0),c=lead(1),st=g.st,win=g.score[0]>g.score[1];
 const who=p=>{const tm=g.players.filter(q=>q.side===p.side);return tm.length>1?(p.data.first===p.data.last?p.data.last:tm.map(q=>q.data.last).join(' & ')):`${p.data.n} ${p.data.first===p.data.last?p.data.last:p.data.name}`};
 const line=(p,s)=>`${who(p)}: ${s.pts} pts${s.threes?`, ${s.threes} three${s.threes>1?'s':''}`:''}${s.dunks?`, ${s.dunks} dunk${s.dunks>1?'s':''}`:''}${s.steals?`, ${s.steals} steal${s.steals>1?'s':''}`:''}${s.blocks?`, ${s.blocks} block${s.blocks>1?'s':''}`:''}`;
 hideTouch();gameBtns(true);
 let head,msg,btns='';
 if(cfg.mode==='2p'){head=g.score[0]>g.score[1]?'Maroon wins!':'Gold wins!';msg='Practice is over. Bring that energy to the next game.';btns=`<button class="btn gold" id="again">Rematch</button>`}
 else if(cfg.mode==='cpu'){head=win?'Flyers win!':`${c.team.name} wins`;msg=win?'Mineola is loud tonight.':'Shake it off. Run it back.';btns=`<button class="btn gold" id="again">Rematch</button>`}
 else{
  const s=seasonState(),sg=SEASON[cfg.si];
  if(s.i===cfg.si){
   if(win){s.res[cfg.si]='W';s.scores[cfg.si]=g.score.slice();s.i++;if(cfg.si===SEASON.length-1)s.champ=true}
   else if(!sg.playoff){s.res[cfg.si]='L';s.scores[cfg.si]=g.score.slice();s.i++}
   saveSeason(s);
  }
  if(win&&cfg.si===SEASON.length-1){head='CHSAA CHAMPIONS!';msg='The Flyers did it. Hang the banner in Mineola.';confetti()}
  else if(win&&cfg.si===4){head='#1 seed clinched!';msg='First #1 seed since the 2024 state title team. The playoffs start now.'}
  else if(win){head='Flyers win!';msg=sg.playoff?'On to the championship.':'One step closer to the crown.'}
  else if(sg.playoff){head='Season on the line';msg='Playoff losses don\'t count here. Run it back until you get it.'}
  else{head=`${c.team.name} wins`;msg='It goes on the record. The playoffs are what matter.'}
  btns=sg.playoff&&!win?`<button class="btn gold" id="again">Run it back</button><button class="btn ghost" id="hub">Season</button>`:`<button class="btn gold" id="hub">${cfg.si===SEASON.length-1&&win?'See the season':'Next game'}</button>`;
 }
 show(`<div class="hero"><div class="eyebrow">Final${g.ot?' · OT':''} · ${cfg.tag}</div><h1>${head}</h1>
 <div class="big-score">${g.score[0]} – ${g.score[1]}</div><p>${msg}</p></div>
 <div class="keys"><div><h3>${a.team.abbr} · ${a.team.jersey==='#ffc72c'?'Gold':'Maroon'}</h3><p>${line(a,st[0])}</p><p class="muted">Shots made: ${st[0].fgm}/${st[0].fga}</p></div><div><h3>${c.team.abbr}${cfg.mode==='2p'?' · Gold':''}</h3><p>${line(c,st[1])}</p><p class="muted">Shots made: ${st[1].fgm}/${st[1].fga}</p></div></div>
 <div class="btns">${btns}<button class="btn ghost" id="menu">Main menu</button></div>`);
 on('#again',()=>start(cfg));on('#hub',()=>{game=null;seasonHub()});on('#menu',()=>mainMenu());
}
function togglePause(){
 if(!game)return;paused=!paused;
 if(paused){show(`<div class="hero"><div class="eyebrow">Timeout</div><h1>Paused</h1><p class="muted">${game.score[0]} – ${game.score[1]} · ${game.ot?'Overtime':Math.ceil(game.t)+'s left'}</p></div><div class="btns"><button class="btn gold" id="res">Resume</button><button class="btn ghost" id="snd">Sound: ${muted?'Off':'On'}</button><button class="btn ghost" id="quit">Quit game</button></div>`);
  on('#res',()=>togglePause());on('#snd',el=>{muted=!muted;store.set('fhh_muted',muted);el.textContent='Sound: '+(muted?'Off':'On')});on('#quit',()=>{paused=false;mainMenu()})}
 else{hideOverlay();setTouch(game.humans);gameBtns(false)}
}
document.getElementById('pauseBtn').addEventListener('click',()=>togglePause());
document.getElementById('menuBtn').addEventListener('click',()=>{audio();paused=false;mainMenu()});
function confetti(){const cols=['#a3203a','#ffffff','#ffc72c'];const L=[];for(let i=0;i<160;i++)L.push({x:Math.random()*innerWidth,y:-Math.random()*innerHeight,v:2+Math.random()*3,c:cols[i%3],s:5+Math.random()*6,r:Math.random()*6});
 const k=document.createElement('canvas');k.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9';k.width=innerWidth;k.height=innerHeight;document.body.appendChild(k);const x=k.getContext('2d');let n=0;
 (function f(){x.clearRect(0,0,k.width,k.height);for(const p of L){p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}if(++n<360)requestAnimationFrame(f);else k.remove()})();}

// expose for testing
window.__fhh={render:t=>render(t),tick:n=>{for(let i=0;i<n&&game&&game.state!=="over";i++)step(STEP)},get game(){return game},start,findP,rivalPlayer,RIVALS,CHAM,CHAM_W,HOOPS,shoot:p=>shoot(p),shootQ:(p,q)=>shoot(p,q),zone,release,dunk,pass,get view(){return{VW,VH,OY,camX}}};

champCache=!!seasonState().champ;
loadPhotos();
mainMenu();
if(document.fonts){const rb=()=>{layers=null;hudKey='';headCache.clear()};document.fonts.ready.then(rb);document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',rb)}
requestAnimationFrame(frame);
})();
</script>
