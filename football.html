<style>
/* Layout: one column. Menus are plain responsive pages; in a game the 16:9 pixel canvas sits on top with the play-call bar under it. */
:root{
  --night:#8f1229;      /* page ground: Chaminade red */
  --night-2:#ad1c37;    /* raised panels, a brighter red */
  --line:#e0aa2e;       /* panel borders: gold */
  --deep:#6a0b1e;       /* inputs and secondary buttons */
  --crimson:#4a0612;    /* dark red for shadows */
  --crimson-hi:#c93652;
  --gold:#ffc72c;       /* Chaminade gold, brightened */
  --chalk:#fff8e8;      /* text */
  --dim:#ffe2a8;        /* secondary text: pale yellow */
  --turf:#3c8a3a;
  --good:#b6ff9e; --bad:#ffd0d0;

html,body{height:100%}

*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
button,select{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.btn{font-family:var(--f-display);font-size:12px;line-height:1;padding:14px 16px;border:0;border-radius:0;background:var(--gold);color:#5a0d1c;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px var(--night),0 0 0 5px #fff3c4;cursor:pointer;text-transform:uppercase}
.btn:hover{background:#ffd65c}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 3px var(--night),0 0 0 5px #fff3c4}
.btn:focus-visible,select:focus-visible{outline:3px dashed var(--gold);outline-offset:6px}
.btn.alt{background:var(--deep);color:var(--chalk);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 0 0 3px var(--night),0 0 0 5px var(--gold)}
.btn.alt:hover{background:#86122b}
.btn.gold{background:#fff1b8;color:#5a0d1c}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.panel{background:var(--night-2);border:2px solid var(--line);padding:16px;min-width:0}
.eyebrow{font-family:var(--f-display);font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.dim{color:var(--dim)}
.small{font-size:15px}
.tnum{font-variant-numeric:tabular-nums}

/* Title screen */
.hero{display:grid;gap:18px;padding-block:8px}
.marquee{position:relative;overflow:hidden;border:4px solid var(--gold);background:repeating-linear-gradient(135deg,rgba(255,199,44,.07) 0 14px,transparent 14px 28px),linear-gradient(#c22540,#8f1229);padding:22px 18px 18px}
.marquee h1{font-size:clamp(22px,5.4vw,46px);line-height:1.15;color:var(--gold);text-shadow:4px 4px 0 var(--crimson)}
.marquee p{max-width:60ch;margin:12px 0 0}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.5}
.menu{display:flex;flex-wrap:wrap;gap:18px;padding:6px}

/* Season hub */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.next{display:flex;flex-direction:column;gap:12px}
.vs{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip{display:inline-block;width:16px;height:16px;border:2px solid var(--chalk);vertical-align:middle}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-size:9px;color:var(--dim);font-weight:400;letter-spacing:.08em}
tr.us td{color:var(--gold)}
td.res-w{color:var(--good)} td.res-l{color:var(--bad)}

/* Roster */
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.lineup label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}
.lineup select{background:var(--deep);border:2px solid var(--line);padding:6px;font-size:16px;color:var(--chalk);width:100%}
input.rate{width:64px;background:var(--deep);border:2px solid var(--line);color:var(--chalk);font:inherit;font-size:16px;padding:4px 6px}
input.rate.edited{border-color:#fff3c4;color:var(--gold)}
input.rate:focus-visible{outline:3px dashed var(--gold);outline-offset:2px}
td.note{white-space:normal;min-width:200px;color:var(--gold);font-size:14px}

#game{display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto}
.sbar{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:0 auto 6px;font-family:"Press Start 2P",monospace;font-size:12px;line-height:1}
.sbar>span{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#000;border:2px solid #000;color:#fff;white-space:nowrap}
.sbar .sc{color:#ffd640}.sbar .dd{color:#ffd640}.sbar .yl{color:#fff;font-size:10px}.sbar .tos{display:inline-flex;gap:3px}.sbar .tos i{display:block;width:8px;height:4px;background:#444}.sbar .tos i.on{background:#ffd640}
@media (max-width:560px){.sbar{font-size:9px}.sbar>span{padding:6px 7px;gap:6px}.sbar .yl{font-size:8px}}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;max-height:calc(100vh - 210px);margin:0 auto;background:#000;border:3px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
@media (max-height:520px){.stage{max-height:calc(100vh - 136px)}}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;min-height:56px;padding:4px 0}
.playbook{display:flex;flex-wrap:wrap;gap:6px;width:100%;justify-content:center}
.pbtn{font-family:var(--f-display);font-size:9px;line-height:1.2;padding:9px 10px;background:var(--night-2);border:2px solid var(--line);color:var(--chalk);cursor:pointer;display:flex;gap:6px;align-items:center}
.pbtn .k{color:var(--dim)}
.pbtn.run{border-color:#9be38f}
.pbtn:hover{border-color:var(--gold)}
.pbtn{background:var(--deep)}
.pbtn.on{background:var(--gold);color:#5a0d1c;border-color:var(--gold)}
.pbtn.on .k{color:#5a4010}
.pbtn:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
.bar .info{font-size:16px;color:var(--dim);flex:1 1 220px;min-width:0}
.bar .info b{color:var(--chalk);font-weight:600}
.drive{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.drive .big{font-family:var(--f-display);font-size:14px;color:var(--gold)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.iconbtn{font-family:var(--f-display);font-size:10px;padding:8px 10px;background:var(--deep);border:2px solid var(--line);cursor:pointer;color:var(--chalk)}
.iconbtn:hover{background:#86122b}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.boxscore td:first-child{color:var(--dim)}
.howto li{margin-bottom:6px}
.howto{max-width:68ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let actx=null;
function tone(f,d=.08,type="square",v=.05,delay=0){
  if(!save.sound)return;

    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);

  }catch(e){}
}

function prerenderStadium(homeKey,awayKey,venueName){
  const c=document.createElement("canvas");   // rendered at 2x so lines and numbers are crisp on the 2x screen
  const CW=Math.ceil((WX1-WX0)*XS),CH=Math.ceil((WY1-WY0)*YS);c.width=CW*2;c.height=CH*2;

  for(let j=0;j<12;j++){g.fillStyle=j%2?"rgba(255,255,255,.035)":"rgba(0,0,0,.035)";g.fillRect(X(0),Y(j*FW/12),X(120)-X(0),Math.ceil(FW/12*YS))}
  {const rr=(()=>{let a=99;return()=>(a=(a*16807)%2147483647)/2147483647})();
   for(let i=0;i<26000;i++){const x=X(rr()*120),y=Y(rr()*FW);g.fillStyle=rr()<.5?"rgba(0,0,0,.07)":"rgba(255,255,220,.06)";g.fillRect(x+(rr()<.5?0:.5),y+(rr()<.5?0:.5),.5,rr()<.4?1:.5)}
   const sh=g.createLinearGradient(0,Y(0),0,Y(FW));sh.addColorStop(0,"rgba(0,0,0,.10)");sh.addColorStop(.45,"rgba(255,255,255,.04)");sh.addColorStop(1,"rgba(0,0,0,.12)");g.fillStyle=sh;g.fillRect(X(0),Y(0),X(120)-X(0),Y(FW)-Y(0))}

  // yard lines

  g.fillRect(X(0),Y(0),2,Y(FW)-Y(0));g.fillRect(X(120)-2,Y(0),2,Y(FW)-Y(0));
  for(let yd=11;yd<110;yd++){if(yd%5===0)continue;[0.9,FW-1.6,22.5,29.5].forEach(hy=>g.fillRect(X(yd),Y(hy),1,2))}
  // big yard numbers, near and far

  for(let yd=20;yd<=100;yd+=10){const n=String(yd<=60?yd-10:110-yd);
    [9,FW-9].forEach(ny=>{g.save();g.translate(X(yd),Y(ny));g.scale(0.8,0.75);g.fillStyle="rgba(255,255,255,.88)";g.fillText(n,0,0);g.restore()})}
  // midfield logo
  g.save();g.translate(X(60),Y(FW/2));g.scale(1,YS/XS);

  g.font='30px "Press Start 2P", monospace';g.fillStyle=tc(home);g.fillText(isGS?"C":home.short[0],2,3);g.restore();
  if(isGS){g.save();g.translate(X(60),Y(FW/2+7.5));g.scale(1,.8);g.font='8px "Press Start 2P", monospace';g.fillStyle="#f4f4ec";g.fillText("OTT FIELD",0,0);g.restore()}
  // ---------- grandstand behind the far sideline ----------

  g.fillStyle=isGS?"#2a0b12":"#22242c";g.fillRect(0,sBot,CW,Y(-0.6)-sBot);
  {const sg=g.createLinearGradient(0,Y(0),0,Y(6));sg.addColorStop(0,"rgba(0,0,0,.22)");sg.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=sg;g.fillRect(0,Y(-0.6),CW,Y(6)-Y(-0.6))}

  g.fillStyle=TEAMS[awayKey].c1;g.fillRect(X(64),Y(FW+1.6),X(82)-X(64),3);

  E.push(mk("O","WR2",lx-0.9,clamp(sy+16,2.5,FW-2.5),{p:op("WR2"),rec:true}));
  E.push(mk("O","TE",lx-1.2,sy+5.8,{p:op("TE"),rec:true}));
  const dsp=5.7+def/100*1.3,cbs=6.8+def/100*1.4+DF("cbSpd");   // their DBs can run with our receivers
  const dp=n=>D?{p:byNum(n)}:{},DEF_LINEUP=defLineup();
  const sp=(n,fallback,k)=>D?ySpd(byNum(n))*k:fallback;
  [-6,-2.1,2.1,6].forEach((o,i)=>E.push(mk("D","DL",lx+1.4,sy+o,Object.assign({i,spd:sp(DEF_LINEUP.DL[i],dsp-0.5,.74)},dp(DEF_LINEUP.DL[i])))));

  E.push(mk("D","S",lx+14,sy+11,Object.assign({deep:true,spd:sp(DEF_LINEUP.S2,cbs-0.2,.96)},dp(DEF_LINEUP.S2))));
  applyDefCall(E,lx,sy);

const PLAYS=[

  {id:"mesh",name:"Mesh",kind:"pass",tip:"Two shallow crossers rub off each other.",r:{WR1:"drag",WR2:"drag",TE:"corner",RB:"wheel"}},
  {id:"post",name:"Post Corner",kind:"pass",tip:"Deep shots. Back and tight end stay in to block.",r:{WR1:"post",WR2:"corner",TE:"block",RB:"block"}},
  {id:"verts",name:"Four Verticals",kind:"pass",tip:"Everybody goes deep.",r:{WR1:"go",WR2:"go",TE:"seam",RB:"check"}},

/* ---------- opponent possessions are simulated ---------- */
function simDrive(start,O,D,ot){
  const r=Math.random();
  if(ot){const pTD=clamp(0.42+(O-D)/150,0.2,0.7),pFG=0.28;
    if(r<pTD)return{res:"TD",plays:irnd(3,7),yards:100-start};
    if(r<pTD+pFG)return{res:"FG",plays:irnd(3,6),yards:irnd(5,15)};
    return{res:"STOP",plays:irnd(3,5),yards:irnd(-5,9)}}
  const pTD=clamp(0.2+(O-D)/140+(start-25)/170+DF("oppTD"),0.06,0.75),pFG=0.16,pTO=0.1,pDowns=0.05;
  const plays=irnd(3,12),yards=irnd(4,70);
  if(r<pTD)return{res:"TD",plays:Math.max(plays,4),yards:100-start};
  if(r<pTD+pFG)return{res:"FG",plays,yards:clamp(irnd(40,72)-start+25,8,100-start-4)};
  if(r<pTD+pFG+pTO)return{res:"TO",plays,yards:Math.min(yards,100-start-6)};
  if(r<pTD+pFG+pTO+pDowns)return{res:"DOWNS",plays,yards:Math.min(yards,100-start-6)};
  return{res:"PUNT",plays:Math.min(plays,7),yards:Math.min(irnd(0,35),100-start-10)};
}

    case"FG":G.them+=3;text="FIELD GOAL "+O.mascot.toUpperCase();nextOn=irnd(20,32);break;
    case"TO":text="TURNOVER! "+stopper.last.toUpperCase()+" COMES UP WITH IT";nextOn=clamp(100-(start+d.yards),5,80);break;
    case"DOWNS":text="FLYERS D HOLDS ON 4TH DOWN";nextOn=clamp(100-(start+d.yards),5,80);break;
    case"PUNT":text=O.mascot.toUpperCase()+" PUNT";{const land=start+d.yards+irnd(34,44);nextOn=land>=100?20:clamp(100-land,5,50)}break;

// simulated Flyers strength: a perennial AAA contender, plus how good the chosen starters are
function chamSim(side){const L=lineup(),keys=side==="off"?["QB","RB","WR1","WR2","TE","LT","LG","C","RG","RT"]:["DL1","DL2","DL3","DL4","CB1","CB2","LB1","LB2","LB3","S1","S2"];
  const avg=keys.reduce((t,k)=>t+starB(byNum(L[k])),0)/keys.length;return 80+avg*4+(side==="def"?dfLvl()*2:0)}
function simScore(a,b){const A=TEAMS[a],B=TEAMS[b];
  const ao=a==="CHAM"?chamSim("off"):A.off,ad=a==="CHAM"?chamSim("def"):A.def,bo=b==="CHAM"?chamSim("off"):B.off,bd=b==="CHAM"?chamSim("def"):B.def;
  const pts=(o,d)=>Math.max(0,Math.round(rnd(7,28)+(o-d)/2.2));
  let sa=pts(ao,bd),sb=pts(bo,ad);if(sa===sb){Math.random()<.5?sa+=3:sb+=3}return[sa,sb]}
function applyResult(a,b,sa,sb,leagueGame){const L=save.season.league;
  [[a,sa,sb],[b,sb,sa]].forEach(([k,f,ag])=>{const r=L[k];if(!r)return;r.pf+=f;r.pa+=ag;if(f>ag){r.w++;if(leagueGame)r.lw++}else{r.l++;if(leagueGame)r.ll++}})}
function simOtherGames(ourOpp){
  const pool=LEAGUE.filter(k=>k!=="CHAM"&&k!==ourOpp).sort(()=>Math.random()-.5);
  const out=[];
  for(let i=0;i+1<pool.length;i+=2){const[a,b]=[pool[i],pool[i+1]];const[sa,sb]=simScore(a,b);applyResult(a,b,sa,sb,true);out.push([a,b,sa,sb])}
  return out;
}
function recordSeasonGame(won){
  const S=save.season;
  if(G.ctx.type==="season"){
    const wk=S.week,opp=G.opp,lg=!!TEAMS[opp].league;
    S.results[wk]={us:G.us,them:G.them,ot:G.ot};
    applyResult("CHAM",opp,G.us,G.them,lg);
    S.lastOthers=simOtherGames(lg?opp:null);
    S.week++;
    if(S.week>=sched().length)startPlayoffs();
  }else{ // playoff
    const P=S.playoffs;
    if(P.round==="semi"){
      P.semi.us={us:G.us,them:G.them};
      const[o1,o2]=P.otherSemi;const[s1,s2]=simScore(o1,o2);P.semi.other=[o1,o2,s1,s2];
      if(won){P.round="final";P.finalOpp=s1>s2?o1:o2;P.finalHome=P.seed<P.top.indexOf(P.finalOpp)+1}else{P.round="out";S.done=true}
    }else if(P.round==="final"){P.final={us:G.us,them:G.them};P.round=won?"champs":"runnerup";S.done=true;
      if(won){save.titles=save.titles||[];if(!save.titles.includes(S.year))save.titles.push(S.year)}}
  }
  writeSave();
}
function standings(){const L=save.season.league;return LEAGUE.map(k=>({k,...L[k]})).sort((a,b)=>(b.lw/Math.max(1,b.lw+b.ll))-(a.lw/Math.max(1,a.lw+a.ll))||(b.lw-b.ll)-(a.lw-a.ll)||(b.w-b.l)-(a.w-a.l)||(b.pf-b.pa)-(a.pf-a.pa))}
function startPlayoffs(){
  const S=save.season,st=standings(),top=st.slice(0,4).map(r=>r.k);
  const seed=top.indexOf("CHAM");
  if(seed<0){S.playoffs={round:"missed",top};S.done=true;return}
  const opp=top[3-seed];const others=top.filter(k=>k!=="CHAM"&&k!==opp);
  S.playoffs={round:"semi",top,seed:seed+1,semiOpp:opp,semiHome:seed<2,otherSemi:others,semi:{}};
}
function addSeasonStats(){
  if(!save.season||G.ctx.type==="quick")return;
  const T=save.season.stats;const s=G.stats;
  const add=(k,o)=>{const t=T[k]||(T[k]={});for(const f in o)t[f]=(t[f]||0)+o[f]};
  add("q"+G.lineup.QB,{c:s.pass.c,a:s.pass.a,py:s.pass.y,ptd:s.pass.td,int:s.pass.int});
  for(const n in s.rush)add("p"+n,{ra:s.rush[n].a,ry:s.rush[n].y,rtd:s.rush[n].td});
  for(const n in s.rec)add("p"+n,{rc:s.rec[n].c,cy:s.rec[n].y,ctd:s.rec[n].td});
  for(const n in G.dstats||{}){const d=G.dstats[n];add("p"+n,{tk:d.tk,sk:d.sk,dint:d.int,pd:d.pd})}
  writeSave();
}

  const semiRes=pair=>{if(!P||!P.semi)return"";if(pair.includes("CHAM")&&P.semi.us){const w=P.semi.us.us>P.semi.us.them;return` · ${w?"W":"L"} ${P.semi.us.us}-${P.semi.us.them}`}
    if(P.semi.other&&pair.includes(P.semi.other[0])){const[o1,o2,s1,s2]=P.semi.other;return` · ${esc(TEAMS[s1>s2?o1:o2].short||"")} ${Math.max(s1,s2)}-${Math.min(s1,s2)}`}return""};
  const fin=P&&P.finalOpp?`${sl("CHAM")} vs ${sl(P.finalOpp)}${P.final?` · ${P.final.us>P.final.them?"W":"L"} ${P.final.us}-${P.final.them}`:""}`:P&&P.semi&&P.semi.other&&P.round==="out"?"Flyers knocked out":"TBD";
  const bracket=`<div class="panel"><div class="eyebrow" style="margin-bottom:8px">CHSFL AAA playoffs${P&&P.top?"":" · if the season ended today"}</div>
    <div class="small">Semifinal: ${sl(semiA[0])} vs ${sl(semiA[1])}${semiRes(semiA)}</div>
    <div class="small">Semifinal: ${sl(semiB[0])} vs ${sl(semiB[1])}${semiRes(semiB)}</div>
    <div class="small" style="margin-top:6px"><b>Championship:</b> ${fin}</div>
    ${P&&P.round==="missed"?`<div class="small dim" style="margin-top:6px">The Flyers finished outside the top four.</div>`:""}
    ${(save.titles||[]).length?`<div class="small" style="margin-top:6px;color:var(--gold)">League titles: ${save.titles.join(", ")}</div>`:""}</div>`;
  const others=(S.lastOthers||[]).map(([a,b,sa,sb])=>`${esc(TEAMS[sa>sb?a:b].name)} ${Math.max(sa,sb)}, ${esc(TEAMS[sa>sb?b:a].name)} ${Math.min(sa,sb)}`).join(" · ");
  $("#menu").innerHTML=`
  <div class="topline"><h2 style="font-size:14px">${Y} SEASON</h2><span class="row"><button class="iconbtn" id="s-office" type="button">FRONT OFFICE · ${save.cc} CC</button><button class="iconbtn" id="s-roster" type="button">ROSTER</button><button class="iconbtn" id="s-home" type="button">MENU</button></span></div>
  <div class="grid2">
    <div class="panel next">${next}</div>
    <div class="panel"><div class="eyebrow">Flyers record</div><div class="disp tnum" style="font-size:28px;margin:10px 0">${rec.w}-${rec.l}</div><div class="dim small">League ${rec.lw}-${rec.ll} · Points for ${rec.pf}, against ${rec.pa}</div>${others?`<div class="small" style="margin-top:10px"><span class="dim">Around the league last week:</span> ${others}</div>`:""}</div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">Schedule</div><div class="tbl-wrap"><table><thead><tr><th>DATE</th><th>OPPONENT</th><th>YOUR RESULT</th>${Y===2026?"<th>REAL 2026</th>":""}</tr></thead><tbody>${schedRows}</tbody></table></div></div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">CHSFL AAA standings</div><div class="tbl-wrap"><table><thead><tr><th>#</th><th>TEAM</th><th>LG</th><th>ALL</th><th>PF</th><th>PA</th></tr></thead><tbody>${st}</tbody></table></div><p class="small dim">Other teams' games are simulated. The Flyers play every AAA school each season; the other five games rotate among CHSFL AA schools and outside rivals. Top four in AAA make the playoffs.</p></div>
  </div>${bracket}`;
  $("#s-home").onclick=()=>showMenu("title");$("#s-roster").onclick=()=>showMenu("roster");$("#s-office").onclick=()=>showMenu("office");
  if($("#s-new"))$("#s-new").onclick=()=>{newSeason();renderSeason()};
  const simOne=(opp,type)=>{let[a,b]=simScore("CHAM",opp);if(type==="playoff"&&a===b)a+=3;G={opp,us:a,them:b,ot:false,ctx:{type},lineup:lineup(),stats:{pass:{c:0,a:0,y:0,td:0,int:0},rush:{},rec:{}}};save.cc=(save.cc||0)+(a>b?2:1);recordSeasonGame(a>b);G=null};
  if($("#s-sim"))$("#s-sim").onclick=()=>{simOne(SCH[S.week].opp,"season");renderSeason()};
  if($("#s-simall"))$("#s-simall").onclick=()=>{while(!S.done&&S.week<SCH.length)simOne(SCH[S.week].opp,"season");renderSeason()};
  if($("#s-psim"))$("#s-psim").onclick=()=>{simOne(P.round==="semi"?P.semiOpp:P.finalOpp,"playoff");renderSeason()};
  if($("#s-play"))$("#s-play").onclick=()=>{
    if(!S.done&&S.week<SCH.length){const g=SCH[S.week];newGame(g.opp,{type:"season",home:g.home,site:g.site})}
    else if(P.round==="semi")newGame(P.semiOpp,{type:"playoff",round:"semi",label:"AAA Semifinal",home:P.semiHome!==false});
    else if(P.round==="final")newGame(P.finalOpp,{type:"playoff",round:"final",label:"AAA Championship",home:P.finalHome!==false});
  };
}

function renderQuick(){
  const opts=Object.keys(TEAMS).filter(k=>k!=="CHAM").map(k=>`<button class="btn alt" data-k="${k}" type="button" style="display:flex;gap:10px;align-items:center">${teamChip(k)} ${esc(TEAMS[k].name)}</button>`).join("");

}

function renderRoster(){
  const L=lineup(),T=(save.season&&save.season.stats)||{};
  const NAT={QB:["QB"],RB:["RB"],WR1:["WR"],WR2:["WR"],TE:["TE"],LT:["OL"],LG:["OL"],C:["OL"],RG:["OL"],RT:["OL"],DL1:["DL"],DL2:["DL"],DL3:["DL"],DL4:["DL"],CB1:["CB"],CB2:["CB"],LB1:["ILB","OLB"],LB2:["ILB","OLB"],LB3:["ILB","OLB"],S1:["S"],S2:["S"],K:["K"]};
  const LBL={WR1:"WR 1",WR2:"WR 2",LT:"Left tackle",LG:"Left guard",C:"Center",RG:"Right guard",RT:"Right tackle",DL1:"DL 1",DL2:"DL 2",DL3:"DL 3",DL4:"DL 4",CB1:"CB 1",CB2:"CB 2",LB1:"LB (covers TE)",LB2:"LB (covers RB)",LB3:"LB (zone)",S1:"Safety 1",S2:"Safety 2",K:"Kicker"};
  const opt=(slot,p)=>`<option value="${p.num}"${p.num===L[slot]?" selected":""}>#${p.num} ${esc(p.name)} (${p.pos}) ${"★".repeat(stars(p))}</option>`;
  const pick=slot=>{const nat=ROSTER.filter(p=>NAT[slot].includes(p.pos)),rest=ROSTER.filter(p=>!NAT[slot].includes(p.pos));
    return`<label for="lu-${slot}">${LBL[slot]||slot}<select id="lu-${slot}" data-slot="${slot}"><optgroup label="${NAT[slot].join("/")}">${nat.map(p=>opt(slot,p)).join("")}</optgroup><optgroup label="Everyone else">${rest.map(p=>opt(slot,p)).join("")}</optgroup></select></label>`};
  const sel=(slot,filter)=>`<label for="lu-${slot}">${slot.replace(/\d/,"")}${slot.match(/\d/)?" "+slot.match(/\d/)[0]:""}<select id="lu-${slot}" data-slot="${slot}">${ROSTER.filter(filter).map(p=>`<option value="${p.num}"${p.num===L[slot]?" selected":""}>#${p.num} ${esc(p.name)} (${p.pos})</option>`).join("")}</select></label>`;
  const isRB=p=>p.pos==="RB"||p.num===22||p.num===7||p.num===24,isWR=p=>p.pos==="WR"||p.pos==="TE";
  const rows=ROSTER.map(p=>{const s=T["p"+p.num]||{},q=T["q"+p.num];
    const mine=[q&&q.a?`${q.c}/${q.a}, ${q.py} pass yds, ${q.ptd} TD`:"",s.ra?`${s.ra} car, ${s.ry} yds, ${s.rtd} TD`:"",s.rc?`${s.rc} rec, ${s.cy} yds, ${s.ctd} TD`:"",s.tk||s.sk||s.dint||s.pd?`${s.tk||0} tkl, ${s.sk||0} sacks, ${s.dint||0} INT, ${s.pd||0} PD`:""].filter(Boolean).join(" · ");
    return`<tr><td>${iconImg(p)}</td><td class="tnum">${p.num}</td><td>${esc(p.name)}</td><td>${p.pos}</td><td>${p.cls}</td><td class="tnum">${esc(p.ht)} / ${p.wt}</td><td>${esc(p.home)}</td><td class="tnum dim"><span style="color:var(--gold)">${starStr(p)}</span>${["WR","RB","TE","QB"].includes(p.pos)||p.num===22?` SPD ${R(p,"spd")} · HND ${R(p,"hnd")}${p.pos==="QB"?" · ARM "+R(p,"arm"):""}`:""}</td><td class="note">${FACTS[p.num]?esc(FACTS[p.num]):""}${mine?`<div style="color:var(--chalk)">Your season: ${mine}</div>`:""}</td></tr>`}).join("");
  $("#menu").innerHTML=`<div class="topline"><h2 style="font-size:14px">2026 FLYERS ROSTER</h2><span class="row"><button class="iconbtn" id="r-edit" type="button">EDIT RATINGS</button><button class="iconbtn" id="r-back" type="button">BACK</button></span></div>
  <div class="panel"><div class="eyebrow" style="margin-bottom:10px">Starting offense</div><div class="lineup">
    ${OFF_SLOTS.map(pick).join("")}
  </div><div class="eyebrow" style="margin:18px 0 10px">Starting defense</div><div class="lineup">${DEF_SLOTS.map(pick).join("")}</div>
  <div class="eyebrow" style="margin:18px 0 10px">Special teams</div><div class="lineup">${pick("K")}</div>
  <p class="small dim">Pick anyone for any spot. If you choose a player who already starts somewhere else on the same side, the two swap. Ratings carry over: a fast corner covers better, a heavy line protects longer.</p><p class="small dim">Head coach Thomas Claro. Kicker Kellan Stapleton (#33). Punter Christian Birch Trani (#9). Anthony Trapani is listed at ILB by the school but leads the team in rushing, so he starts at running back.</p></div>
  <div class="panel"><div class="tbl-wrap"><table><thead><tr><th></th><th>#</th><th>NAME</th><th>POS</th><th>CL</th><th>HT / WT</th><th>HOMETOWN</th><th>GAME RATING</th><th>REAL 2026 FACTS</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  $("#r-back").onclick=()=>showMenu(save.season?"season":"title");
  $("#r-edit").onclick=()=>showMenu("edit");
  document.querySelectorAll("[data-slot]").forEach(s=>s.onchange=()=>{
    const L=lineup(),slot=s.dataset.slot,v=+s.value,side=OFF_SLOTS.includes(slot)?OFF_SLOTS:DEF_SLOTS.includes(slot)?DEF_SLOTS:[slot];
    const other=side.find(k=>k!==slot&&L[k]===v);if(other)L[other]=L[slot];L[slot]=v;
    save.lineup=L;writeSave();if(other)renderRoster()});
}

/* Edit any player's ratings by hand. A typed rating replaces the made-up one and any training on it. */
function renderEdit(){
  const K=[["spd","SPD"],["hnd","HND"],["arm","ARM"],["pow","POW"]];
  const rows=ROSTER.map(p=>{const ed=(save.edit&&save.edit[p.num])||{};
    return`<tr><td>${iconImg(p)}</td><td class="tnum">${p.num}</td><td>${esc(p.name)}</td><td>${p.pos}</td>
      ${K.map(([k,l])=>`<td><input class="rate${ed[k]!=null?" edited":""}" type="number" min="40" max="99" inputmode="numeric" aria-label="${esc(p.name)} ${l}" data-num="${p.num}" data-k="${k}" value="${R(p,k)}"></td>`).join("")}
      <td class="st" data-st="${p.num}" style="color:var(--gold)">${starStr(p)}</td>
      <td>${Object.keys(ed).length?`<button class="iconbtn" type="button" data-reset="${p.num}">RESET</button>`:""}</td></tr>`}).join("");
  $("#menu").innerHTML=`<div class="topline"><h2 style="font-size:14px">EDIT RATINGS</h2><span class="row"><button class="iconbtn" id="e-all" type="button">RESET ALL</button><button class="iconbtn" id="e-back" type="button">BACK</button></span></div>
  <p class="dim small" style="margin:0">Type any rating from 40 to 99 and it saves right away. Stars update as you go. SPD is speed, HND is hands (catching, and interceptions on defense), ARM is throwing for quarterbacks, POW is power (breaking tackles, line blocking, tackling). Stars come from speed and hands for receivers, arm for quarterbacks, and speed and power for everyone else.</p>
  <div class="panel"><div class="tbl-wrap"><table><thead><tr><th></th><th>#</th><th>NAME</th><th>POS</th>${K.map(([,l])=>`<th>${l}</th>`).join("")}<th>STARS</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  $("#e-back").onclick=()=>showMenu("roster");
  $("#e-all").onclick=()=>{if(confirm("Put every player back to their original ratings? Typed ratings are cleared; training from the Front Office stays.")){save.edit={};writeSave();renderEdit()}};
  document.querySelectorAll("input.rate").forEach(inp=>inp.onchange=()=>{
    const n=+inp.dataset.num,k=inp.dataset.k,v=Math.round(clamp(+inp.value||40,40,99));inp.value=v;
    save.edit=save.edit||{};(save.edit[n]=save.edit[n]||{})[k]=v;writeSave();inp.classList.add("edited");
    const cell=document.querySelector(`[data-st="${n}"]`);if(cell)cell.textContent=starStr(byNum(n));
    const row=inp.closest("tr");if(!row.querySelector("[data-reset]")){row.lastElementChild.innerHTML=`<button class="iconbtn" type="button" data-reset="${n}">RESET</button>`;bindReset()}});
  const bindReset=()=>document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{if(save.edit)delete save.edit[+b.dataset.reset];writeSave();renderEdit()});
  bindReset();
}
function renderHowto(){
  $("#menu").innerHTML=`<div class="topline"><h2 style="font-size:14px">HOW TO PLAY</h2><button class="iconbtn" id="h-back" type="button">BACK</button></div>
  <div class="panel howto"><ol>
    <li><b>Style.</b> RETRO BOWL (the default) plays like Retro Bowl: no playbook, every snap is a fresh set of routes, you play offense and the other team's drives play out on their own. COACH lets you call plays and play defense. Switch on the title screen.</li>
    <li><b>Snap.</b> Tap the field (or press Space).</li>
    <li><b>Hand off.</b> The running back runs past the quarterback right after the snap. Tap while the "TAP TO HAND OFF" prompt shows to give him the ball.</li>
    <li><b>Pass.</b> Press anywhere and drag backward, like a slingshot. The dotted arc shows where the ball lands. Let go to throw. A quick flick throws a hard, flat bullet.</li>
    <li><b>Scramble.</b> On a keyboard, the arrow keys or WASD move the quarterback. Cross the line and he becomes a runner.</li>
    <li><b>Run.</b> The ball carrier runs upfield by himself. Hold your finger above or below him to steer. Swipe up or down to juke, tap to dive forward for extra yards (dive across the goal line to score), swipe forward for a burst of speed, swipe back to hesitate. Receivers lay out for passes just out of reach on their own. Keys: W/S or up/down to move, right arrow to burst, D to dive, A to hesitate, Space to juke.</li>
    <li><b>Kick.</b> For a field goal or extra point, drag back from anywhere like a slingshot, aim the dotted line at the posts and let go. Pull farther for more distance. The line turns green when the kick is long enough. Watch the wind. Punts and kickoffs happen on their own.</li>
    <li><b>After a touchdown</b> choose the extra point or a two-point try from the 3.</li>
    <li><b>Timeouts.</b> You get three per half. A timeout gives back the clock that ran after your last play.</li>
    <li><b>Defense (Coach mode).</b> When the other team has the ball, pick a call: Man Press, Cover 2, Cover 3, LB Blitz or Run Stop (keys 1 to 5). The Flyers line up with real players, like Kasouf and Murray at corner, Hyland, Trapani and Mastronardi at linebacker, and Sykes at safety. Tap a defender before the snap to control him (the yellow ring and name show who). After the snap, hold the field to steer him toward your finger, then tap to dive at the ball carrier or jump a pass. Keys: arrows move, Space dives or jumps, E switches to the defender closest to the ball. Tackles, sacks, picks and pass breakups are credited by name. Prefer to skip it? Choose SIM under Defense, or tap Sim drive.</li>
    <li><b>Front office.</b> Wins earn coaching credits. Spend them to train players (speed, hands, arm, power) or hire an offensive line coach and a defensive coordinator.</li>
  </ol><p class="dim small">Turn your phone sideways for the biggest field.</p></div>`;
  $("#h-back").onclick=()=>showMenu("title");
}

/* ---------- front office: coaching credits, star ratings, training, staff ---------- */
function starVal(p){const r=k=>R(p,k);return p.pos==="QB"?r("arm")*.7+r("spd")*.3:p.pos==="WR"?(r("spd")+r("hnd"))/2:p.pos==="TE"?(r("hnd")+r("pow"))/2:p.pos==="K"?r("pow")+8:(r("spd")+r("pow"))/2}
function stars(p){return clamp(Math.round((starVal(p)-58)/7),1,5)}
function starStr(p){const n=stars(p);return"★".repeat(n)+"☆".repeat(5-n)}
function trainCost(p){const t=save.train[p.num]||{};const n=Object.values(t).reduce((a,b)=>a+b,0)/3;return 2+Math.floor(n/2)}
function renderOffice(){
  const L=lineup(),offSlots=[["QB",L.QB],["RB",L.RB],["WR 1",L.WR1],["WR 2",L.WR2],["TE",L.TE],["K",L.K]];
  const defSlots=[["CB 1",L.CB1],["CB 2",L.CB2],["LB",L.LB1],["LB",L.LB2],["LB",L.LB3],["Safety",L.S1],["Safety",L.S2],["DL",L.DL1],["DL",L.DL2],["DL",L.DL3],["DL",L.DL4]];
  const attrs=(p,def)=>def?["spd","pow","hnd"]:p.pos==="QB"?["arm","spd","hnd"]:p.pos==="K"?["pow"]:["spd","hnd","pow"];
  const nameO={spd:"Speed",hnd:"Hands",arm:"Arm",pow:"Power"},nameD={spd:"Speed",pow:"Tackling",hnd:"Ball skills"};
  const card=def=>([slot,n])=>{const p=byNum(n),c=trainCost(p),name=def?nameD:nameO;
    return`<div class="panel" style="display:flex;flex-direction:column;gap:8px">
      <div class="eyebrow">${slot}</div>
      <div class="row" style="gap:10px">${iconImg(p,48)}<div><b>#${p.num} ${esc(p.name)}</b> <span class="dim small">${p.pos} · ${p.cls}</span></div></div>
      <div style="color:var(--gold);font-size:20px;letter-spacing:2px">${starStr(p)}</div>
      ${attrs(p,def).map(k=>`<div class="row" style="justify-content:space-between;gap:8px"><span class="small">${name[k]} <b class="tnum">${R(p,k)}</b></span><button class="iconbtn" type="button" data-train="${p.num}" data-attr="${k}" ${save.cc<c||R(p,k)>=99?"disabled":""}>+3 · ${c} CC</button></div>`).join("")}
    </div>`};
  const cards=offSlots.map(card(false)).join(""),dcards=defSlots.map(card(true)).join("");
  const up=[["ol","Offensive line coach","Linemen hold their blocks longer on every snap."],["df","Defensive coordinator","Your whole defense rates higher, and simulated opponent drives score less often."]];
  const COST=[4,6,8];
  const staff=up.map(([k,t,d])=>{const lv=save.up[k]||0,c=COST[lv];return`<div class="panel" style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">${t}</div><div class="small">${d}</div><div class="tnum">Level ${lv} / 3</div>${lv<3?`<button class="btn alt" type="button" data-up="${k}" ${save.cc<c?"disabled":""}>Upgrade · ${c} CC</button>`:`<span class="dim small">Maxed out</span>`}</div>`}).join("");
  $("#menu").innerHTML=`<div class="topline"><h2 style="font-size:14px">FRONT OFFICE</h2><span class="row"><span class="disp tnum" style="font-size:12px;color:var(--gold)">${save.cc} COACHING CREDITS</span><button class="iconbtn" id="o-back" type="button">BACK</button></span></div>
  <p class="dim small">Season wins earn 3 credits, losses 1, plus 1 for scoring 28 or more. Training and staff carry over to new seasons. Star ratings are game ratings, not real scouting.</p>
  <div class="eyebrow">Train your offense</div>
  <div class="lineup" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))">${cards}</div>
  <div class="eyebrow">Train your defense</div>
  <p class="dim small" style="margin:0">Speed helps defenders stay with receivers and chase down runners. Tackling makes their hits stick. Ball skills turn breakups into interceptions.</p>
  <div class="lineup" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))">${dcards}</div>
  <div class="eyebrow">Coaching staff</div>
  <div class="grid2">${staff}</div>`;
  $("#o-back").onclick=()=>showMenu(save.season?"season":"title");
  document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>{const p=byNum(+b.dataset.train),k=b.dataset.attr,c=trainCost(p);if(save.cc<c)return;save.cc-=c;const ed=save.edit&&save.edit[p.num];if(ed&&ed[k]!=null)ed[k]=Math.min(99,ed[k]+3);else{const t=save.train[p.num]||(save.train[p.num]={});t[k]=(t[k]||0)+3}writeSave();SFX.catch();renderOffice()});
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const k=b.dataset.up,lv=save.up[k]||0,c=COST[lv];if(save.cc<c||lv>=3)return;save.cc-=c;save.up[k]=lv+1;writeSave();SFX.catch();renderOffice()});
}

$("#b-quit").onclick=()=>{if(!G)return;saveOnLeave();const t=G.ctx.type;G=null;showMenu(t==="quick"?"title":"season")};
$("#b-sound").onclick=()=>{save.sound=!save.sound;writeSave();$("#b-sound").textContent=save.sound?"SOUND ON":"SOUND OFF"};

   LOOP

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&!$("#game").hidden&&G.phase){try{const n=Math.max(1,Math.ceil(dt/(1/120)));for(let i=0;i<n&&G;i++)update(dt/n);if(G)draw()}catch(err){console.error(err)}}
  requestAnimationFrame(frame)}
const fontsReady=document.fonts?Promise.race([document.fonts.load('16px "Press Start 2P"'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
/* leaving mid-game (closing the tab, switching games) saves where you are; coming back picks it right up */
function saveOnLeave(){try{if(G&&G.phase&&G.ents&&G.phase!=="final"&&!G.gm&&G.ctx&&G.ctx.type!=="goalie")saveMid()}catch(e){}}
addEventListener("pagehide",saveOnLeave);document.addEventListener("visibilitychange",()=>{if(document.hidden)saveOnLeave()});
fontsReady.then(()=>{let back=false;try{if(save&&save.mid&&TEAMS[save.mid.opp]){resumeMid();back=!!G}}catch(e){G=null}
  if(!back)showMenu("title");requestAnimationFrame(frame)});
window.__gsg={get G(){return G},setDiff:d=>{save.diff=d},snap,throwBall,newGame,juke,dive,handoff,update,continueAfterDrive,kickTap,kickNow,startKick,tickClock,oppDrive,defAction,switchDefender,w2s:e=>({x:wx(e.x)/VW,y:wy(e.y)/VH})};
})();
</script>
